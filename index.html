  if(!MODAL) return;
  if(MODAL === "ask") return finishAsk(null);
  if(!popOverlay()){ MODAL = null; renderModal(0); }
}
function renderModal(scrollY){
  const el = $("#modal"); if(!el) return;
  if(!MODAL || !MODALS[MODAL]){
    el.classList.remove("on"); $("#modalBody").innerHTML = "";
    document.body.style.overflow = "";
    return;
  }
  const m = MODALS[MODAL];
  $("#modalTitle").textContent = (typeof m.title === "function") ? m.title() : m.title;
  $("#modalBody").innerHTML = m.body();
  el.classList.add("on");
  document.body.style.overflow = "hidden";      /* 모달 뒤 화면이 같이 스크롤되지 않게 */

/* ══════════════════════════════════════════════════════════════════════
   확인·입력 창
   ── 브라우저 기본 confirm/prompt 를 대신합니다. 카톡 인앱 브라우저에서
      모양이 깨지거나 아예 막히는 경우가 있고, 무엇보다 「무엇이 사라지는지」를
      제대로 설명할 자리가 없습니다.
   ── 답을 Promise 로 돌려주므로 부르는 쪽은 await 한 줄이면 됩니다.
        if(!await askConfirm("지웁니다", "…")) return;
        const name = await askText("이름", "", "A안");
   ══════════════════════════════════════════════════════════════════════ */
let ASK = null;

function askBody(){
  const a = ASK;
  return `
    ${a.body ? `<p class="sm" style="margin:0 0 12px;line-height:1.65">${a.body}</p>` : ""}
    ${a.input !== null ? `
      <input type="text" id="askInput" value="${esc(a.input)}"
        placeholder="${esc(a.placeholder||"")}" style="margin-bottom:12px"
        onkeydown="if(event.key==='Enter'){event.preventDefault();askOk()}">` : ""}
    <div class="grid2">
      <button class="btn" onclick="finishAsk(null)">${esc(a.cancel)}</button>
      <button class="btn ${a.danger?"danger":"p"}" onclick="askOk()">${esc(a.ok)}</button>
    </div>`;
}
function askOk(){
  const el = document.getElementById("askInput");
  finishAsk(el ? (el.value != null ? el.value : "") : true);
}
/* 답이 정해졌습니다 — 창을 닫고 기다리던 쪽에 돌려줍니다.
   쌓아 둔 기록도 함께 되감아 뒤로가기 횟수가 어긋나지 않게 합니다. */
function finishAsk(value){
  if(!ASK) return;
  const resolve = ASK.resolve;
  ASK = null; MODAL = null; renderModal(0);
  if(OV.length){ OV.pop(); try{ history.back(); }catch(e){} }
  resolve(value);
}
function askDialog(opt){
  if(ASK) finishAsk(null);                       /* 이미 열려 있으면 그것부터 정리 */
  return new Promise(resolve=>{
    ASK = Object.assign({title:"확인", body:"", input:null, placeholder:"",
                         ok:"확인", cancel:"취소", danger:false}, opt);
    ASK.resolve = resolve;
    MODAL = "ask"; renderModal(0);
    pushOverlay(()=>{ const r = ASK && ASK.resolve; ASK = null; MODAL = null;
                      renderModal(0); if(r) r(null); });
    setTimeout(()=>{ const el = document.getElementById("askInput");
                     if(el){ el.focus(); el.select(); } }, 40);
  });
}
async function askConfirm(title, body, opt){
  return !!(await askDialog(Object.assign({title, body}, opt)));
}
async function askText(title, body, value, opt){
  const v = await askDialog(Object.assign({title, body, input:value==null?"":String(value)}, opt));
  return v === null ? null : String(v);
}

/* ── 대시보드 ──────────────────────────────────────────────────────── */
/* ── 홈의 안 박스 ──────────────────────────────────────────────────────
   접어 두지 않고 늘 펼쳐 둡니다. 안마다 박스 하나, 만든 순서대로 위에서 아래로.
   보고 있는 안은 지금 값으로, 나머지는 굳혀 둔 요약(selSnapshot)으로 그립니다. */
function homePlans(){
  const list = plansInOrder();
  const boxes = list.length ? list.map(v => planBox(v, v.id === S.cur)).join("")
                            : planBox(null, true);        /* 아직 입력 전 — 지금 값만 */
  return `
  <section class="sec">
    <div class="sec-h"><h2>내 안${list.length > 1 ? ` <span class="tiny muted">${list.length}개</span>` : ""}</h2>
      <button class="btn sm" onclick="TAB='unit';render({top:true})">고르기 ▸</button></div>
    <div class="stack">${boxes}</div>
    ${list.length ? `
    <button class="btn w" style="margin-top:10px" onclick="dupPlan()">＋ 새 안 — 보고 있는 안을 복제</button>
    <div class="grid3" style="margin-top:8px">
      <button class="btn sm" onclick="importSel()">파일에서 불러오기</button>
      <button class="btn sm" onclick="exportSel()">전부 파일로</button>
      <button class="btn sm" onclick="shareLink()">전부 링크로</button>
    </div>` : ""}
  </section>`;
}
function planBox(v, cur){
  const d = cur ? selSnapshot() : v;
  const name = v ? v.name : "1안";
  const lines = d.lines || [], m = d.money;
  return `
  <div class="card pad pbox ${cur ? "cur" : ""}">
    <div class="pb-h">
      <span class="pb-name">${esc(name)}</span>
      ${cur && v ? '<span class="badge b-blue">보는 중</span>' : ""}
      ${v && !v.state ? '<span class="badge b-amber">옵션만</span>' : ""}
      ${v ? `<button class="pb-ren" onclick="renameSel('${v.id}')">이름 수정</button>` : ""}
    </div>
    <div class="tiny muted" style="margin-top:3px">${esc(d.type)} · ${esc(d.floor)} ·
      ${d.minus ? "마이너스옵션" : esc(d.space || "기본형")} · 추가선택품목 ${lines.length}개</div>
    ${lines.length ? `<div class="chips">
      ${lines.slice(0,6).map(o=>`<span class="chip" title="${esc(o.l)}">${
        esc(o.l.length>13 ? o.l.slice(0,12)+"…" : o.l)}</span>`).join("")}
      ${lines.length>6?`<span class="chip">외 ${lines.length-6}개</span>`:""}
    </div>` : ""}
    ${cur ? `
    <button class="pricerow" onclick="openModal('price')">
      <div>
        <div class="tiny muted">총 계약금액</div>
        <b class="num">${kwon(d.total)}</b>
        ${m ? moneyLine(m) : ""}
      </div>
      <span class="pr-more">납부 일정 ▸</span>
    </button>` : `
    <div style="margin-top:10px">
      <div class="tiny muted">총 계약금액</div>
      <b class="num">${kwon(d.total)}</b>
      ${m ? moneyLine(m) : ""}
    </div>`}
    ${!v ? `<p class="tiny muted" style="margin:8px 0 0">
      「고르기」에서 타입과 옵션을 정하면 이 안이 저장됩니다.</p>` : cur ? `
    <div class="grid2" style="margin-top:10px">
      <button class="btn sm" onclick="TAB='unit';render({top:true})">내 집에서 고치기</button>
      <button class="btn sm" onclick="shareLink('${v.id}')">링크로 보내기</button>
    </div>` : `
    <div class="grid3" style="margin-top:10px">
      <button class="btn sm p" onclick="switchPlan('${v.id}')">이 안 보기</button>
      <button class="btn sm" onclick="shareLink('${v.id}')">링크로</button>
      <button class="btn sm" onclick="delSel('${v.id}')">삭제</button>
    </div>`}
  </div>`;
}
function moneyLine(m){
  return `<div class="tiny" style="margin-top:2px;color:${m.gap>=0?"var(--green)":"var(--red)"}">
    조달 ${m.gap>=0 ? `여유 ${won(m.gap)}` : `부족 ${won(-m.gap)}`}
    <span class="muted">· DSR ${m.dsrSolo.toFixed(1)}%</span></div>`;
}

function homeDash(){
  const todo = MS()
    .filter(m=>!S.done[m.id] && !isPast(m))

  return `

/* ── 시작하기 — 세 걸음 (v7) ───────────────────────────────────────────
   v6 은 「직접 입력」을 누르면 내 집으로 보내고 끝이었습니다. 옵션을 다 고른 뒤
   무엇을 해야 하는지 알려 주는 곳이 없어서, 소득·자산을 넣는 데까지 이어지지
   않았습니다. 그래서 할 일을 세 걸음으로 적어 두고, 끝난 걸음은 지워 나갑니다.
   ── 완료 판정은 입력값에서 읽습니다. 따로 「완료」를 누르게 하지 않습니다.
   ── 세 걸음이 다 끝나면 이 카드는 사라집니다.                              */
function startSteps(){
  return [
    /* 내 정보가 먼저입니다 — 신청유형(사전/본청약)에 따라 내 집의 계약금·중도금
       비율이 달라지므로, 유형을 정하기 전에 집을 고르면 틀린 금액을 보게 됩니다. */
    {id:"me",    t:"내 정보 적기",     s:"신청유형·소득·가지고 있는 돈 — 한 번만 적습니다",
     done: (S.me.incomeSelf||0) > 0 || (S.me.assets||[]).length > 0,
     go:"TAB='me';render({top:true})"},
    {id:"unit",  t:"내 집 고르기",     s:"타입·층·옵션을 고르면 총 계약금액이 나옵니다",
     done: (S.saved||[]).length > 0,
     go:"TAB='unit';render({top:true})"},
    {id:"money", t:"자금 계획 확인",   s:"계약금·중도금·잔금을 무엇으로 낼지 나눠 봅니다",
     done: !!S.notes._seenFlow,
     go:"TAB='money';SUB.money='flow';render({top:true})"}
  ];
}
/* 지금 화면 다음에 할 걸음 — 각 화면 맨 아래에 붙입니다 */
function nextStep(from){
  const st = startSteps();
  const i = st.findIndex(x => x.id === from);
  const nx = st.slice(i + 1).find(x => !x.done);
  if(!nx) return "";
  const k = st.indexOf(nx) + 1;
  return `
  <section class="sec">
    <button class="linkrow next" onclick="${nx.go}">
      <div><div class="lr-l">다음 · ${k}. ${nx.t} &nbsp;›</div>
        <div class="lr-s">${nx.s}</div></div>
      <div class="lr-r">${k}/${st.length}</div>
    </button>
  </section>`;
}
function planPicker(){
  const st = startSteps();
  const left = st.filter(x => !x.done).length;
  if(!left) return "";
  const fresh = !(S.saved||[]).length;
  const cur = st.find(x => !x.done);
  return `
    <section class="sec">
      <div class="sec-h"><h2>시작하기</h2>
        <span class="tiny muted">${st.length - left}/${st.length} 완료</span></div>
      <div class="card">
        ${st.map((x,i)=>`
        <button class="step ${x.done ? "done" : ""} ${x === cur ? "cur" : ""}" onclick="${x.go}">
          <span class="step-n">${x.done ? "✓" : i + 1}</span>
          <span class="step-b"><b>${x.t}</b><span class="tiny muted">${x.s}</span></span>
          <span class="step-go">${x === cur ? "시작 ›" : x.done ? "고치기" : "›"}</span>
        </button>`).join("")}
      </div>
      ${fresh ? `
      <p class="tiny muted" style="margin:9px 2px 6px;line-height:1.6">
        입력한 값은 이 브라우저에만 저장되고 어디로도 전송되지 않습니다.
        다른 기기에서 쓰던 것이 있으면 불러올 수 있습니다.</p>
      <div class="${SEED?"grid2":""}">
        ${SEED?`<button class="btn sm" onclick="seed()">내 데이터</button>`:""}
        <button class="btn sm ${SEED?"":"w"}" onclick="importSel()">파일에서 불러오기</button>
      </div>` : ""}
    </section>`;
}

/* 납부 일정 — 대시보드의 총 계약금액을 누르면 열립니다.
   계약금·중도금·잔금을 늘 펼쳐 두면 대시보드가 숫자로 뒤덮이는데,
   정작 자주 보는 건 총액 하나입니다.                                   */
function priceModal(){
  const P = calcPrice();
  const R = RL();
  const rows = [
    ["계약금", P.contract, dateRange(PROJECT.contractDate, PROJECT.contractEnd),
      `현장계약 때 가상계좌로 미리 입금 · ${R.label} ${R.cPct}%`],
    ...R.mids.map((md,i)=>[md.short || "중도금", P.mids[i], md.date.replaceAll("-","."),
                           `주택가격 ${md.pct}% · 중도금 집단대출은 현재 미정 (알선 시 이자후불제)`]),
    ["잔금",   P.balance,  ym(PROJECT.moveIn) + " (예정)",
      "입주 지정기간 · 전용 모기지·자기자금 · 받을 수 없는 기금 융자 55,000천원분 포함"]
  ];
  const parts = [
    ["주택가격", P.base.p],
    ["발코니 확장", P.balc.price],
    ["공간선택 특화형", P.space.p],
    ["추가선택품목", P.optSum.p]
  ].filter(x=>x[1] > 0);

  return `
  <div class="card pad" style="margin-bottom:12px">
    <div class="tiny muted">총 계약금액</div>
    <b class="num" style="font-size:22px;letter-spacing:-.03em">${kwon(P.total)}</b>
    <div class="tiny muted" style="margin-top:3px">
      ${esc(P.T.id)} · ${esc(P.F.band)} ·
      ${S.sel.minus ? "마이너스옵션(기본선택품목)" : "옵션 포함"}</div>
  </div>

  <div class="stack">
    ${rows.map(([l,v,d,note])=>`
    <div class="card pad">
      <div class="row">
        <div style="flex:1;min-width:0">
          <b style="font-size:14px">${l}</b>
          <span class="badge b-gray" style="margin-left:5px">${(v/P.total*100).toFixed(1)}%</span>
          <div class="tiny muted" style="margin-top:2px">${d}</div>
        </div>
        <b class="num" style="font-size:15px">${kwon(v)}</b>
      </div>
      <div class="tiny muted" style="margin-top:6px">${note}</div>
    </div>`).join("")}
  </div>

  ${parts.length > 1 ? `
  <div class="tbl-wrap" style="margin-top:12px">
    <table>
      <thead><tr><th>구성</th><th>금액</th></tr></thead>
      <tbody>
        ${parts.map(([l,v])=>`<tr><td>${l}</td><td class="num">${kwon(v)}</td></tr>`).join("")}
        <tr class="sum"><td>총 계약금액</td><td class="num">${kwon(P.total)}</td></tr>
      </tbody>
    </table>
  </div>` : ""}

  <p class="tiny muted" style="margin:11px 0 0;line-height:1.65">
    여기는 <b>계약금액</b>만입니다. 취득세·법무사·채권할인·관리비 예치금 같은
    <b>부대비용</b>과 중도금 이자는 「자금 · 얼마 내야 하나」에서 따로 계산합니다.</p>
  <button class="btn w" style="margin-top:11px"
    onclick="closeModal();TAB='money';SUB.money='flow';render({top:true})">얼마 내야 하나 보기 ▸</button>`;
}

/* ── 중요 알림 ─────────────────────────────────────────────────────────
   놓치면 되돌릴 수 없는 일정(fatal)입니다. 이것만은 접지 않고 홈 맨 위에 둡니다.
   ── 30일 안쪽만 띄웁니다. 석 달 뒤 일을 늘 빨갛게 띄워 두면 경고에 무뎌져서,
      정작 코앞에 왔을 때 눈에 들어오지 않습니다.                          */
const ALERT_DAYS = 30;
function fatalCard(){
  const fatal = MS().map(m=>({...m, n:msN(m)}))
    .filter(m=>!isPast(m) && !S.done[m.id] && m.fatal && m.n<=ALERT_DAYS).slice(0,3);
  if(!fatal.length) return "";
  return `
  <section class="sec">
    <div class="sec-h"><h2>중요 알림</h2>
      <span class="tiny muted">놓치면 되돌릴 수 없는 일 · ${ALERT_DAYS}일 이내</span></div>
    <div class="stack">
      ${fatal.map(m=>`
      <div class="verdict ${m.n<=14?"v-red":"v-amber"}">
        <div class="row" style="align-items:flex-start">
          <div style="flex:1">
            <div class="v-t" style="font-size:14px">${esc(m.t)}</div>
            <div class="tiny" style="color:var(--ink-2)">${esc(m.miss)}</div>
          </div>
          <div style="text-align:right">
            <div class="dday" style="font-size:16px">${
              msStarted(m) ? (m.n===0?"오늘 마감":"D-"+m.n) : ddayLabel(m.n)}</div>
            <div class="tiny muted">${esc((m.d2||m.d).replaceAll("-","."))}</div>
          </div>
        </div>
      </div>`).join("")}
    </div>
  </section>`;
}

/* ── 그 밖의 일정 — 접어 둡니다 ────────────────────────────────────────
   「임박한 할 일」이 45일 안쪽을 이미 펼쳐 보여 주므로, 여기는 그보다 먼 일과
   지나간 일입니다. 궁금할 때만 펼치면 됩니다.
   ── 입주가 2030년입니다. 스물세 개를 늘 펼쳐 두면 오늘 할 일이 파묻힙니다.   */
function homePlan(){
  const all  = MS().map(m=>({...m, n:msN(m)}));
  const past = all.filter(m=>isPast(m));
  const live = all.filter(m=>!isPast(m));
  const open = !!S.notes._planOpen;
  const pastOpen = !!S.notes._pastOpen;
  const pastDone = past.filter(m=>S.done[m.id]).length;
  const liveDone = live.filter(m=>S.done[m.id]).length;

  return `
  <section class="sec">
    <button class="btn w sm" onclick="toggleOtherPlan()" style="justify-content:space-between">
      <span>그 밖의 일정 <span class="muted">· 앞으로 ${live.length}개${
        past.length?` · 지난 ${past.length}개`:""}</span></span>
      <span>${open?"접기 ▲":"펼치기 ▼"}</span>
    </button>

    ${open ? `
    <div class="sec-h" style="margin:14px 2px 8px">
      <h2>앞으로의 일정</h2>
      <span class="tiny muted">완료 ${liveDone}/${live.length}
        <button class="btn sm" style="margin-left:6px" onclick="window.print()">인쇄</button></span>
    </div>
    <div class="card">
      ${live.length ? live.map(m=>msRow(m)).join("")
        : `<div class="pad tiny muted">남은 일정이 없습니다.</div>`}
    </div>

    ${past.length ? `
    <button class="btn w sm" onclick="togglePast()"
      style="margin-top:10px;justify-content:space-between">
      <span>지난 일정 ${past.length}개 <span class="muted">· 완료 ${pastDone}</span></span>
      <span>${pastOpen?"접기 ▲":"펼치기 ▼"}</span>
    </button>
    ${pastOpen ? `<div class="card" style="margin-top:9px;opacity:.72">
      ${past.map(m=>msRow(m)).join("")}
    </div>` : ""}` : ""}
    ` : ""}
  </section>`;
}
/* ⚠ togglePlan(id) 는 자금 화면의 시점 행을 펼치는 다른 함수입니다. 같은 이름으로
     만들었다가 그쪽을 덮어써서, 시점 행을 눌러도 열리지 않은 적이 있습니다.    */
function toggleOtherPlan(){ S.notes._planOpen = !S.notes._planOpen; save(); render(); }
/* 지난 일정은 그 안에서 한 번 더 접혀 있습니다 — 오늘 이후만 보이게 */
function togglePast(){ S.notes._pastOpen = !S.notes._pastOpen; save(); render(); }
/* opt.need 를 주면 준비물을 칩으로 함께 보여 줍니다.
   「임박한 할 일」에서만 씁니다 — 전체 일정에까지 붙이면 목록이 두꺼워지고,
   먼 일정의 준비물은 지금 챙길 것이 아닙니다.                            */
function msRow(m, opt){
  const done = !!S.done[m.id];
  const lv = LV[m.lv];
  const open = S.notes["_open_"+m.id];
  const dateLabel = m.d2 ? `${m.d.replaceAll("-",".")} ~ ${m.d2.slice(5).replaceAll("-",".")}` : m.d.replaceAll("-",".");
  return `
  <div class="ms ${done?"done":""}" onclick="toggleOpen('${m.id}')">
    <div class="ms-chk" onclick="event.stopPropagation();toggleDone('${m.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
    </div>
    <div class="ms-body">
      <div class="ms-t">${esc(m.t)}
        <span class="badge ${lv.c}">${lv.t}</span>
        ${m.fatal?'<span class="badge b-red">회복불가</span>':""}
        ${MS_TOOLS[m.id] && !open ? `<span class="badge b-gray">도구 ${MS_TOOLS[m.id].length}</span>` : ""}
      </div>
      <div class="ms-d">${dateLabel} · <span class="dday" style="color:${
        done?"var(--ink-3)": m.n<0?"var(--ink-3)": m.n<=7?"var(--red)": m.n<=30?"var(--amber)":"var(--ink-3)"
      }">${msStarted(m) ? (m.n===0 ? "진행 중 · 오늘 마감" : `진행 중 · D-${m.n}`)
                        : ddayLabel(m.n)}</span>${m.time&&m.time!=="—"?` · 소요 ${esc(m.time)}`:""}</div>
      ${(opt && opt.need && !done) ? needChips(m) : ""}
      ${open ? `
      <div class="ms-detail" onclick="event.stopPropagation()">
        <span class="k">할 일</span>${esc(m.todo)}
        ${m.need&&m.need!=="—"?`<span class="k">준비물</span>${esc(m.need)}`:""}
        ${m.miss&&m.miss!=="—"?`<span class="k">안 하면</span>${esc(m.miss)}`:""}
        <span class="k">근거</span><span class="muted">${esc(m.cite)}</span>
        ${msTools(m)}
      </div>`:""}
    </div>
  </div>`;
}
/* 준비물 — 「주민등록표 등·초본, 가족관계증명서, …」 처럼 쉼표로 이어진 한 줄입니다.
   쉼표로 끊어 칩으로 세우면 몇 가지를 챙겨야 하는지 세어집니다.
   「—」 는 준비물이 없다는 뜻이라 아무것도 그리지 않습니다.               */
function needChips(m){
  const raw = (m.need || "").trim();
  if(!raw || raw === "—") return "";
  const items = raw.split(",").map(x=>x.trim()).filter(Boolean);
  return `
  <div class="needs" onclick="event.stopPropagation()">
    <span class="needs-k">준비물 ${items.length}</span>
    ${items.map(x=>`<span class="chip doc" title="${esc(x)}">${
      esc(x.length>18 ? x.slice(0,17)+"…" : x)}</span>`).join("")}
  </div>`;
}
/* 일정마다 그 일을 할 때 쓰는 화면 (v7).
   기능을 탭 이름으로 찾게 하지 않고, 할 일을 펼치면 그 자리에 단추로 나오게 합니다.
   매뉴얼 없이 기능이 필요한 순서대로 드러나는 길이 이것입니다.            */
const MS_TOOLS = {
  m09: [["제출서류 체크", "TAB='docs'"]],
  m10: [["계약금 마련 확인", "TAB='money';SUB.money='flow'"],
        ["자금조달계획서 작성", "TAB='money';SUB.money='filing'"],
        ["차용증 · 이자소득 점검", "TAB='money';SUB.money='tax'"],
        ["계약 서류 체크", "TAB='docs'"]],
  m11: [["옵션 고르기", "TAB='unit'"]],
  m12: [["중도금 마련 확인", "TAB='money';SUB.money='flow'"]],
  m13: [["중도금 마련 확인", "TAB='money';SUB.money='flow'"]],
  m13b:[["중도금 마련 확인", "TAB='money';SUB.money='flow'"]],
  m14: [["대출 · DSR 점검", "TAB='money';SUB.money='dsr'"]],
  m15: [["잔금 · 취득세 마련 확인", "TAB='money';SUB.money='flow'"]]
};
function msTools(m){
  const t = MS_TOOLS[m.id];
  if(!t) return "";
  return `<div class="ms-tools">${t.map(([l,go])=>
    `<button class="btn sm" onclick="event.stopPropagation();${go};render({top:true})">${l} ›</button>`).join("")}</div>`;
}
function toggleDone(id){ S.done[id] = !S.done[id]; save(); render(); }
function toggleOpen(id){ S.notes["_open_"+id] = !S.notes["_open_"+id]; save(); render(); }

/* ══════════════════════════════════════════════════════════════════════════
   내 집
   ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════
   저장안 모달 — 헤더 칩을 누르면 열립니다.
   예전에는 「내 집」 탭 맨 위에 있었는데, 옵션뿐 아니라 자금·서류까지
   담으므로 한 탭에 매달아 둘 자리가 아니었습니다.
   ══════════════════════════════════════════════════════════════════════ */
function plansModal(){
  const P = calcPrice();
  const v = curSel();
  const list = S.saved || [];
  return `

  <div class="card pad" style="margin-bottom:12px">
    <div class="tiny muted" style="margin-bottom:3px">편집 중</div>
    <div class="row">
      <b style="font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
                white-space:nowrap">${v ? esc(v.name) : "저장안 없음"}</b>
    </div>
    <p class="tiny muted" style="margin:7px 0 11px;line-height:1.6">
      ${v ? "고치는 대로 이 안에 저장됩니다. 다른 조합을 시험하려면 <b>복제</b>하십시오 — 소득·자산은 「내 정보」에 있어 다시 적지 않습니다."
          : "아직 저장안이 없습니다. 무언가를 입력하면 「내 안」이 만들어집니다."}</p>
    ${v ? `<div class="grid2">
      <button class="btn" onclick="dupPlan()">복제</button>
      <button class="btn" onclick="renameSel('${v.id}')">이름 바꾸기</button>
    </div>
    <div class="grid2" style="margin-top:9px">
      <button class="btn sm" onclick="shareLink('${v.id}')">이 안을 링크로</button>
      <button class="btn sm" onclick="exportSel('${v.id}')">이 안을 파일로</button>
    </div>` : ""}
  </div>

  ${list.length > 1 ? `
  <div class="sec-h" style="margin:0 2px 8px">
    <h2>다른 안 ${list.length-1}개</h2>
    <span class="tiny muted">최대 ${SAVED_MAX}개</span>
  </div>
  <div class="card">
    ${list.filter(x=>x.id !== S.cur).map(x=>planRow(x, P)).join("")}
  </div>` : ""}

  <div class="grid2" style="margin-top:12px">
    <button class="btn sm" onclick="importSel()">파일에서 불러오기</button>
    <button class="btn sm" onclick="exportSel()">전부 파일로</button>
    <button class="btn sm" onclick="shareLink()">전부 링크로</button>
  </div>
  <p class="tiny muted" style="margin:9px 2px 0;line-height:1.6">
    파일에도 링크에도 옵션과 함께 <b>소득·대출·차용증</b>이 들어갑니다.<br>
    <b>파일</b>은 내 기기에 두는 백업 — 휴대폰에서는 공유 시트의 「파일에 저장」.<br>
    <b>링크</b>는 기기를 옮기거나 남에게 넘길 때 — 숫자 암호로 잠기며,
    암호는 링크와 다른 길로 알려야 합니다.</p>`;
}

/* 목록 한 줄 — 열기 전에 무엇이 다른지 견줄 수 있어야 하므로
   총액 차이와 조달 여유·DSR 을 함께 적어 둡니다.                    */
function planRow(v, P){
  const diff = (P.total - v.total) * 1000;
  const m = v.money || null;
  return `
  <div class="ms" style="cursor:default">
    <div class="ms-body">
      <div class="ms-t">${esc(v.name)}
        ${v.state ? "" : '<span class="badge b-amber">옵션만</span>'}
        ${v.type && v.type !== P.T.id ? `<span class="badge b-gray">${esc(v.type)}</span>` : ""}</div>
      <div class="ms-d">${esc(v.date)} · ${kwon(v.total)}
        ${diff !== 0 ? ` · 지금보다 ${diff>0?"싼":"비싼"} ${won(Math.abs(diff))}` : " · 같은 금액"}</div>
      ${m ? `<div class="tiny" style="margin-top:3px;color:${m.gap>=0?"var(--green)":"var(--red)"}">
        조달 ${m.gap>=0?`여유 ${won(m.gap)}`:`부족 ${won(-m.gap)}`}
        <span class="muted">· DSR ${m.dsrSolo.toFixed(1)}%</span></div>` : ""}
      ${S.notes["_sel_"+v.id] ? planDetail(v) : ""}
      <div class="grid2" style="margin-top:8px">
        <button class="btn sm p" onclick="switchPlan('${v.id}')">이 안으로</button>
        <button class="btn sm" onclick="toggleSel('${v.id}')">${
          S.notes["_sel_"+v.id] ? "접기 ▲" : "자세히 ▼"}</button>
        <button class="btn sm" onclick="exportSel('${v.id}')">파일로</button>
        <button class="btn sm" onclick="delSel('${v.id}')">삭제</button>
      </div>
    </div>
  </div>`;
}
/* 안 전환 바 — 「내 집」과 「자금」 맨 위. 누르면 곧바로 바뀝니다 (잃을 것이 없으므로 묻지 않습니다). */
function planBar(){
  const list = plansInOrder();
  if(!list.length) return "";
  const P = calcPrice();
  return `
  <div class="planbar">
    <div class="seg" role="tablist" aria-label="안 전환">
      ${list.map(v=>`<button aria-selected="${v.id===S.cur}" onclick="switchPlan('${v.id}')">${esc(v.name)}</button>`).join("")}
      <button class="add" onclick="dupPlan()" aria-label="지금 안 복제">＋</button>
    </div>
    <div class="pl-sum">${esc(P.T.id)} · ${esc(P.F.band)} · 옵션 ${P.opts.length}개 · ${kwon(P.total)}</div>
  </div>`;
}
function viewUnit(){
  const P = calcPrice(), T = P.T;
  const tbl = optionTable();
  return `${planBar()}
  <section class="sec">
    <div class="sec-h"><h2>타입 비교</h2>
      <button class="btn sm" onclick="openModal('areas')">면적 보기</button></div>
    <div class="card tbl-wrap">
      <table class="type-tbl">
        <thead><tr><th>타입</th><th>공급 세대</th><th>기준가 (최상 구간)</th></tr></thead>
        <tbody>
        ${PROJECT.types.map(t=>{
          const top = t.floors[t.floors.length-1];
          return `<tr class="${t.id===S.sel.type?"on":""}" onclick="pickType('${t.id}')">
            <td><b>${t.id}</b><div class="tiny muted">${t.code}<br>전용 ${t.exclusive.toFixed(2)}㎡</div></td>
            <td>${(t.unitsPre||0)+(t.unitsBon||0)}<div class="tiny muted">사전 ${t.unitsPre} · 본 ${t.unitsBon}</div></td>
            <td class="num">${kwon(top.price)}<div class="tiny muted">${esc(top.band)}</div></td></tr>`;
        }).join("")}
        </tbody>
      </table>
    </div>
    <p class="tiny muted" style="margin:7px 2px 0">
      기준가는 발코니 확장비·추가선택품목을 뺀 주택가격입니다. 행을 누르면 선택됩니다.
      전용·계약면적은 「면적 보기」에 있습니다.
      견본주택은 51A·55B만 설치되었고, 55A·59A·59T는 팸플릿과
      <a class="ext-link" href="https://www.elife.co.kr" target="_blank" rel="noopener noreferrer">사이버 주택전시관 ↗</a>으로
      확인합니다 <span class="muted">(공고문 1·6쪽)</span>. 링크는 이 앱 밖(단지 홈페이지)에서 열립니다.</p>
  </section>

  ${planSection(T)}

  <section class="sec">
    <div class="sec-h"><h2>층 · 마이너스옵션</h2></div>

/* 그림은 외부 파일입니다. width/height 를 함께 적어 도착 전에 자리를 잡아 두면
   내려받는 동안 아래 내용이 밀려 내려갔다 올라오는 일이 없습니다.           */
function thumb(key, cap, cls){
  const k = imgKey(key), src = IMG[k];
  if(!src) return "";
  const d = IMG_DIM[k] || [320,290];
  return `<img class="${cls}" src="${src}" alt="${esc(cap)}"
    width="${d[0]}" height="${d[1]}" loading="lazy" decoding="async"
    onload="this.classList.add('rdy')" onerror="this.classList.add('rdy')"
    onclick="event.stopPropagation();openLb('${key}','${esc(cap).replace(/'/g,"\\'")}')">`;
}

/* 그림은 타입마다 다릅니다 — IMG 키는 <논리키>__<타입> 형식입니다.
   논리키(plan·sp1·sp2·e1·k4·entrance_base …)로 부르면 여기서 현재 타입 것을 골라 줍니다.
   그 타입에 없는 그림이면 접미사 없는 키로 떨어집니다(대개 없음 → 「사진 없음」).     */

  const k = key + "__" + ((t || getType()).id);

/* ── 라이트박스 — 확대·이동 ────────────────────────────────────────────
   평면도의 치수 숫자를 읽으려면 확대가 필요합니다.
   휠·두 손가락 = 줌, 끌기 = 이동, 두 번 누르기 = 3배 토글.
   원래 크기일 때는 배경이나 그림을 눌러 닫습니다.                        */
let LB = {s:1, x:0, y:0};
function lbApply(){
  const el = $("#lb"), img = $("#lbImg");
  if(LB.s <= 1.001){ LB.s = 1; LB.x = 0; LB.y = 0; }
  el.classList.toggle("z", LB.s > 1);
  img.style.transform = `translate(${LB.x}px, ${LB.y}px) scale(${LB.s})`;
  const pct = $("#lbPct"); if(pct) pct.textContent = Math.round(LB.s*100) + "%";
}
function lbFit(){ LB = {s:1, x:0, y:0, tap:0}; lbApply(); }
// 화면상의 한 점(cx,cy)을 고정한 채 배율만 바꿉니다
function lbScaleAt(next, cx, cy){
  const img = $("#lbImg"); if(!img) return;
  next = Math.min(8, Math.max(1, next));
  const r = img.getBoundingClientRect();
  const ox = r.left + r.width/2, oy = r.top + r.height/2;   // 현재 중심
  const k = next / LB.s;
  LB.x = cx - k*(cx - ox) - (ox - LB.x);
  LB.y = cy - k*(cy - oy) - (oy - LB.y);
  LB.s = next;
  lbApply();
}
function lbZoom(dir){
  const st = $("#lbStage").getBoundingClientRect();
  lbScaleAt(LB.s * (dir > 0 ? 1.5 : 1/1.5), st.left + st.width/2, st.top + st.height/2);
}
function openLb(key, cap){
  const el = $("#lb"); $("#lbImg").src = IMG[imgKey(key)] || "";
  $("#lbCap").textContent = cap || "";
  lbFit(); el.classList.add("on");
  document.body.style.overflow = "hidden";
  pushOverlay(hideLb);
}
/* 실제로 닫는 일 — 뒤로가기(popstate)와 ✕ 가 모두 여기로 옵니다 */
function hideLb(){
  $("#lb").classList.remove("on","z","drag"); $("#lbImg").src = ""; lbFit();
  document.body.style.overflow = "";
}
function closeLb(){ if(!popOverlay()) hideLb(); }

(function lbGestures(){
  const stage = document.getElementById("lbStage");
  const pts = new Map();
  let base = 0, baseScale = 1, moved = 0;

  const dist = () => {
    const [a,b] = [...pts.values()];
    return Math.hypot(a.x-b.x, a.y-b.y);
  };
  const mid = () => {
    const [a,b] = [...pts.values()];
    return {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  };

  stage.addEventListener("pointerdown", e=>{
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    stage.setPointerCapture(e.pointerId);
    if(pts.size === 2){ base = dist(); baseScale = LB.s; }
    if(pts.size === 1) moved = 0;
    $("#lb").classList.add("drag");
  });

  stage.addEventListener("pointermove", e=>{
    const p = pts.get(e.pointerId); if(!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if(pts.size === 2 && base > 0){
      const m = mid();
      lbScaleAt(baseScale * (dist()/base), m.x, m.y);
    } else if(LB.s > 1){
      LB.x += dx; LB.y += dy; lbApply();
    }
  });

  const up = e=>{
    pts.delete(e.pointerId);
    if(pts.size < 2) base = 0;
    if(pts.size === 0){
      $("#lb").classList.remove("drag");
      if(moved < 8){
        const now = Date.now();
        if(LB.tap && now - LB.tap < 300){    // 두 번 누르기 → 3배 토글
          LB.tap = 0;
          if(LB.s > 1) lbFit(); else lbScaleAt(3, e.clientX, e.clientY);
        } else {
          LB.tap = now;
          const t = now;
          // 원래 크기에서 한 번만 누르면 닫습니다 (두 번째 누름이 오면 취소)
          if(LB.s <= 1) setTimeout(()=>{ if(LB.tap === t) closeLb(); }, 300);
        }
      }
      moved = 0;
    }
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);

  stage.addEventListener("wheel", e=>{
    e.preventDefault();
    lbScaleAt(LB.s * (e.deltaY < 0 ? 1.18 : 1/1.18), e.clientX, e.clientY);
  }, {passive:false});
})();
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if($("#lb").classList.contains("on")) closeLb();
  else if(MODAL) closeModal();
});
/* 모달 안에서 Tab 이 뒤 화면으로 새어 나가지 않게 가둡니다 */
document.addEventListener("keydown", e=>{
  if(e.key !== "Tab" || !MODAL) return;
  const box = document.querySelector(".modal-box"); if(!box) return;
  const f = [...box.querySelectorAll('button,input,select,textarea,[href]')]
              .filter(el=>!el.disabled && el.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
/* ── 선택안 저장 (F2-3) ────────────────────────────────────────────────
   선택품목 결정(2026.11.30~12.01) 전까지 조합을 여러 개 만들어 비교하기 위한 기능.
   계약 후에는 변경이 불가하므로 확정안을 남겨두는 용도로도 씁니다.             */
const SAVED_MAX = 12;

/* 저장 시점의 선택 내용을 사람이 읽을 수 있게 풀어 둡니다.
   나중에 옵션표가 바뀌어도 파일만 보고 무엇을 골랐는지 알 수 있어야 하므로,
   id 뿐 아니라 그룹명·품목명·금액을 함께 적어 둡니다.                        */
/* 저장에 담을 상태 — saved(저장 목록) 자신은 빼야 중첩되지 않습니다 */
/* notes 는 아코디언 펼침 같은 화면 상태뿐이라 뺍니다 —
   남의 파일을 열었을 때 남의 접힘 상태까지 따라오면 안 됩니다. */
/* ── 안(案)에 담기는 것 (v7) ─────────────────────────────────────────────
   자금조달방안마다 달라지는 값만 담습니다.
   ── 빠진 것과 그 이유:
      me            소득·기존대출 — 사람에게 딸린 사실입니다. 안마다 다를 수 없습니다.
      role          사전청약/본청약 당첨자 — 마찬가지입니다.
      done · docs   마일스톤·서류 체크 — 진행 기록입니다. 2안을 만들었다고
                    떼어 둔 서류를 다시 떼야 할 이유가 없습니다.
   v6 까지는 이 넷이 안에 들어 있어서, 안을 바꾸면 체크해 둔 서류가 통째로
   바뀌고 1안에서 고친 소득이 2안에 반영되지 않았습니다.                    */
const PLAN_KEYS = ["sel","fin","filing","plan","loanNote"];

/* ══════════════════════════════════════════════════════════════════════
   편집 중인 안
   ── 앱은 늘 저장안 하나를 편집 중입니다 (S.cur 이 그 id).
   ── saveNow() 가 쓸 때마다 지금 값을 그 안에 함께 굳히므로, 화면의 값과
      안은 어긋날 수 없습니다. 그래서 「변경됨」·「이 안에 저장」·「열기」
      확인창이 없습니다 — v7 개정 전에는 셋 다 있었고, 「변경됨」은 값이
      이미 자동저장된 뒤에도 떠 있는 거짓 경보였습니다.
   ══════════════════════════════════════════════════════════════════════ */

/* 입력이 하나라도 있는지 가리는 지문 (notes 같은 화면 상태는 뺍니다) */
function stateSig(st){
  const o = {};
  PLAN_KEYS.forEach(k => { o[k] = st[k]; });
  return JSON.stringify(o);
}
function curSel(){ return (S.saved||[]).find(v=>v.id === S.cur) || null; }
/* S.saved 는 새 안이 앞에 쌓입니다 (가득 차면 뒤, 곧 가장 오래된 것부터 밀려납니다).
   보여 줄 때는 만든 순서대로 — 1안 아래에 2안이 생깁니다. */
function plansInOrder(){ return [...(S.saved||[])].reverse(); }
function nextPlanName(){
  const have = new Set((S.saved||[]).map(v=>v.name));
  let n = (S.saved||[]).length + 1;
  while(have.has(n + "안")) n++;
  return n + "안";
}
/* 개정 전 저장본은 화면 값이 안과 다를 수 있었습니다(「변경됨」 상태로 닫은 경우).
   그대로 두면 첫 자동저장이 그 안을 화면 값으로 덮으므로, 화면 값을 새 안으로 떼어 둡니다. */
function forkUnsaved(){
  const v = curSel();
  if(!v || !v.state || stateSig(S) === stateSig(v.state)) return;
  const snap = selSnapshot();
  snap.name = v.name + " (저장 안 한 변경)";
  S.saved.unshift(snap); S.cur = snap.id;
}
/* 저장안이 하나도 없으면 지금 값을 담은 「내 안」을 만듭니다.
   save() 안에서 부르므로, 처음 무언가를 입력하는 순간 생깁니다.
   (앱을 열기만 하고 아무것도 안 한 사람에게는 만들지 않습니다)          */
function ensureCurrent(){
  S.saved = S.saved || [];
  if(!S.saved.length){
    /* 화면을 펼쳐 보기만 한 것으로는 안을 만들지 않습니다.
       stateSig 는 notes(화면 상태)를 빼고 견주므로,
       아코디언을 열었다 닫은 것은 「입력」으로 치지 않습니다.        */
    if(stateSig(S) === stateSig(BLANK)) return;
    const snap = selSnapshot();
    snap.name = "1안";
    S.saved.unshift(snap); S.cur = snap.id;
  } else if(!S.cur || !curSel()){
    S.cur = S.saved[0].id;
  }
}

/* 프로젝트 한 벌 = 되돌릴 상태(state) + 목록에서 바로 보여 줄 요약(sum)
   요약을 따로 적어 두는 이유는, 불러오지 않고도 견줄 수 있어야 하기 때문입니다. */
function selSnapshot(){
  const P = calcPrice(), C = calcCashflow(), D = calcDsr(), M = calcMortgage();
  const fl = filingTotals();
  const state = {};
  PLAN_KEYS.forEach(k => { state[k] = structuredClone(S[k]); });
  return {
    id:"v" + Date.now(),
    kind:"project", v:SCHEMA,
    date:stamp(true),
    project:PROJECT.id,
    state,
    sel:structuredClone(S.sel),          // 예전 형식과의 호환용
    role:RL().id, roleLabel:RL().label,
    type:P.T.id, floor:P.F.band,
    space:(PROJECT.spaceOptions.find(s=>s.id===S.sel.space)||{}).label || "",
    minus:!!S.sel.minus,
    total:P.total, contract:P.contract, mid:P.mid, balance:P.balance,
    optCount:P.opts.length,
    lines:P.opts.map(o=>({g:o.g, l:o.l, p:o.p})),
    money:{
      need:C.need, have:C.have, gap:C.gap, own:C.own, loanSum:C.loanSum,
      extra:C.X.total,
      mortgage:M.amount, mortgageLtv:M.ltv, ltv:D.ltv,
      dsrSolo:D.soloRatio, dsrJoint:D.jointRatio, spouse:!!S.me.spouseEmployed,
      filingSum:fl.sum, filingSelf:fl.self, filingLoan:fl.loan,
      midLoan:midLoanOn()
    }
  };
}
// 계획서 기재값 합계 (요약용)
function filingTotals(){
  let sum = 0, self = 0, loan = 0;
  PROJECT.filingLines.forEach(l=>{
    const v = Number((S.filing||{})[l.id]) || 0;
    sum += v; if(l.kind === "self") self += v; else loan += v;
  });
  return {sum, self, loan};
}
/* 지금 값을 편집 중인 안에 굳힙니다 — saveNow() 가 쓸 때마다 부릅니다. */
function commitCur(){
  const v = curSel();
  if(!v) return null;
  const i = S.saved.findIndex(x=>x.id === v.id);
  const snap = selSnapshot();
  snap.id = v.id; snap.name = v.name;      /* id·이름은 지킵니다 */
  S.saved[i] = snap;
  return v;
}
/* 지금 안을 복제합니다 — 「1안을 두고 2안을 시험」할 때.
   원래 안은 지금 값 그대로 남고, 이후로는 복제본을 편집합니다. */
async function dupPlan(){
  saveNow();                                /* 원래 안에 마지막 입력까지 굳혀 둡니다 */
  const base = curSel();
  const snap = selSnapshot();
  const def = nextPlanName();
  const name = await askText("새 안",
    `<b>‘${esc(base ? base.name : "지금 값")}’</b>을 복제해 새 안을 만듭니다. 원래 안은 그대로 남고, 이후로는 새 안을 편집합니다. `
    + "소득·자산은 「내 정보」에 있으므로 다시 적지 않습니다.",
    def, {ok:"복제", placeholder:def});
  if(name === null) return;

  S.saved = S.saved || [];
  if(S.saved.length >= SAVED_MAX){
    const old = S.saved[S.saved.length-1];
    if(!await askConfirm("저장안이 가득 찼습니다",
        `이 브라우저에는 ${SAVED_MAX}개까지 남습니다. 만들면 가장 오래된 `
        + `‘${esc(old.name)}’이 밀려납니다. 남겨 두려면 먼저 파일로 저장하십시오.`,
        {ok:"만들고 밀어내기", danger:true})) return;
  }
  snap.name = name.trim() || def;
  S.saved.unshift(snap);
  if(S.saved.length > SAVED_MAX) S.saved.length = SAVED_MAX;
  S.cur = snap.id;
  if(!saveNow()) return render();
  render(); toast(`‘${snap.name}’을 만들었습니다`);
}
/* 안 하나를 화면에 올립니다. 예전 형식(옵션만)은 옵션만 바꿉니다. */
function applyPlan(v){
  if(v.state) PLAN_KEYS.forEach(k=>{
    if(v.state[k] !== undefined) S[k] = structuredClone(v.state[k]);
  });
  else S.sel = structuredClone(v.sel);
  S.cur = v.id;
}
/* 안 전환 — 지금 안은 이미 굳어 있으므로 묻지 않고 바꿉니다 */
function switchPlan(id){
  if(id === S.cur) return;
  const v = (S.saved||[]).find(x=>x.id===id); if(!v) return;
  saveNow();                                /* 떠나는 안에 마지막 입력까지 굳힙니다 */
  applyPlan(v);
  saveNow(); render();
  if(!v.state) toast(`‘${v.name}’은 예전 형식이라 옵션만 바꿨습니다`);
}
async function delSel(id){
  const v = (S.saved||[]).find(x=>x.id===id); if(!v) return;
  if(!await askConfirm(`‘${v.name}’ 삭제`,
      "이 저장안만 지웁니다. 다른 안과 「내 정보」는 그대로 남습니다.",
      {ok:"삭제", danger:true})) return;
  S.saved = S.saved.filter(x=>x.id!==id);
  /* 편집 중인 안을 지웠다면 다른 안을 올립니다 — 그대로 두면 지운 값이 옆 안에 굳습니다 */
  if(S.cur === id){ if(S.saved[0]) applyPlan(S.saved[0]); else S.cur = null; }
  save(); render(); toast("삭제했습니다");
}
async function renameSel(id){
  const v = (S.saved||[]).find(x=>x.id===id); if(!v) return;
  const n = await askText("이름 변경", "", v.name, {ok:"바꾸기"}); if(n===null) return;
  v.name = n.trim() || v.name; save(); render();
}
function toggleSel(id){
  S.notes["_sel_"+id] = !S.notes["_sel_"+id]; save(); render();
}

/* ── 세이브 파일 ───────────────────────────────────────────────────────
   프로젝트 한 벌을 담은 파일입니다 — 옵션 선택과 함께 소득·대출·차용증·계획서 기재값
   같은 재무정보가 들어갑니다. 남에게 넘길 파일이 아닙니다.
   같은 단지의 파일만 받아들이고, 불러올 때는 지우지 않고 위에 얹습니다.     */
const SEL_FILE = {app:"ipju", kind:"project", v:3};
function selFileName(v){
  const t = v ? v.name : "전체";
  const safe = String(t).replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, " ").trim().slice(0,40);
  return `저장안_${PROJECT.id}_${safe}_${stamp()}.json`;
}
/* 파일로 내보내기
   아이폰 사파리는 blob 링크를 “내려받기”가 아니라 “화면에 열기”로 처리해서
   JSON 원문이 그대로 보입니다. 그래서 공유 시트(navigator.share)를 먼저 씁니다 —
   거기서 「파일에 저장」·카톡·메모 어디로든 바로 보낼 수 있습니다.
   공유가 없는 환경(데스크톱 브라우저 등)에서는 예전처럼 내려받습니다.        */
function downloadJson(obj, filename){
  const text = JSON.stringify(obj, null, 2);
  const file = new File([text], filename, {type:"application/json"});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:filename})
      .catch(err=>{
        if(err && err.name === "AbortError") return;   // 사용자가 닫은 것
        saveAsFile(text, filename);                    // 공유가 막히면 내려받기로
      });
    return true;
  }
  saveAsFile(text, filename);
  return false;
}
function saveAsFile(text, filename){
  const blob = new Blob([text], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
/* 파일과 링크가 같은 내용을 담도록 한 군데서 만듭니다.
   v7 부터 소득·기존대출(me)과 신청유형(role)은 안이 아니라 파일 한 벌에
   한 번만 담깁니다 — 안마다 들고 있을 값이 아니기 때문입니다.            */
function selPayload(list){
  return {...SEL_FILE, project:PROJECT.id, projectName:PROJECT.name,
          exported:stamp(true), me:structuredClone(S.me), role:S.role,
          saved:structuredClone(list)};
}
/* 내보낼 대상 — id 를 주면 그 안 하나, 없으면 전부.
   200ms 미뤄 둔 마지막 입력이 파일에서 빠지지 않게 먼저 씁니다. */
function selTargets(id){
  saveNow();
  const all = S.saved || [];
  const one = id ? all.find(x=>x.id===id) : null;
  return {one, list: one ? [one] : all};
}
function exportSel(id){
  const {one, list} = selTargets(id);
  if(!list.length) return toast("저장한 선택안이 없습니다");
  const shared = downloadJson(selPayload(list), selFileName(one));
  if(shared) return toast("공유할 곳을 고르세요 — 「파일에 저장」을 권합니다");
  toast(one ? "파일로 저장했습니다 (자금 입력 포함)"
            : `${list.length}개를 파일로 저장했습니다 (자금 입력 포함)`);
}
function importSel(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d;
      try { d = JSON.parse(rd.result); }
      catch(e){ return toast("JSON 파일이 아닙니다"); }
      mergeSaved(d);
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* 파일에서 왔든 링크에서 왔든, 받은 것을 목록에 얹는 길은 하나입니다.
   덮어쓰지 않고 항상 「추가」만 합니다 — 쓰던 값이 사라지면 안 됩니다. */
async function mergeSaved(d){
  /* 아무것도 없는 사람이 받았다면 받은 것을 바로 올립니다 —
     빈 화면에서 전환을 또 눌러야 하는 것은 이상합니다. */
  const wasEmpty = !(S.saved||[]).length && stateSig(S) === stateSig(BLANK);
  const list = Array.isArray(d) ? d : (d && Array.isArray(d.saved) ? d.saved : null);
  if(!list) return toast("선택안 파일이 아닙니다");
  if(d && d.project && d.project !== PROJECT.id)
    return toast(`다른 단지의 파일입니다 (${d.project})`);
  const valid = list.filter(v => v && v.sel && typeof v.total === "number");
  if(!valid.length) return toast("불러올 선택안이 없습니다");
  S.saved = S.saved || [];
  const have = new Set(S.saved.map(x=>x.id));
  const fresh = [];
  let added = 0;
  valid.forEach(v=>{
    const c = structuredClone(v);
    const clash = have.has(c.id);
    if(clash) c.id = "v" + Date.now() + "_" + added;
    c.name = (c.name || "이름 없음") + (clash ? " (사본)" : "");
    fresh.push(c); have.add(c.id); added++;
  });
  /* 넘치면 내 저장안이 뒤에서 잘려 나갑니다 — 반드시 물어봅니다 */
  const over = S.saved.length + fresh.length - SAVED_MAX;
  if(over > 0){
    const drop = S.saved.slice(-over).map(x=>x.name).join("’ · ‘");
    if(!await askConfirm("목록이 넘칩니다", `이 브라우저에는 ${SAVED_MAX}개까지 남습니다. 불러오면 오래된 `
        + `${over}개(‘${esc(drop)}’)가 사라집니다. 남겨 두려면 먼저 파일로 저장하십시오.`,
        {ok:"밀어내고 불러오기", danger:true}))
      return toast("불러오기를 취소했습니다");
  }
  fresh.reverse().forEach(c => S.saved.unshift(c));
  if(S.saved.length > SAVED_MAX) S.saved.length = SAVED_MAX;
  if(wasEmpty){
    const v = S.saved[0];
    if(v && v.state) PLAN_KEYS.forEach(k=>{
      if(v.state[k] !== undefined) S[k] = structuredClone(v.state[k]); });
    S.cur = (v||{}).id || null;
    /* 빈 기기로 옮겨 온 경우에만 소득·기존대출·신청유형까지 받습니다.
       이미 쓰던 사람에게는 손대지 않습니다 — 남의 소득이 내 칸에 덮이면
       DSR 이 통째로 틀어지는데, 그걸 알아채기가 어렵습니다.
       v6 이하 파일에는 me 가 없으므로 안 쪽 fin 에서 꺼내 옵니다.        */
    const legacy = (v && v.state && v.state.fin) || {};
    S.me = Object.assign(structuredClone(BLANK.me), S.me);
    ME_FROM_FIN.forEach(k=>{
      if(d.me && d.me[k] !== undefined) S.me[k] = structuredClone(d.me[k]);
      else if(legacy[k] !== undefined)  S.me[k] = structuredClone(legacy[k]);
    });
    if(d.role) S.role = d.role;
    else if(v && v.role) S.role = v.role;
  }
  saveNow(); render({top:true}); toast(`${added}개를 불러왔습니다`);
}

/* ══════════════════════════════════════════════════════════════════════
   링크로 주고받기 (v6)
   ── 파일 대신 주소 하나로 옮깁니다. 담기는 내용은 파일과 똑같습니다.
   ── 「#」 뒤는 서버로 전송되지 않습니다 — 접속기록에도 CDN 에도 남지
      않습니다. 남는 곳은 링크를 붙여 넣은 대화창뿐입니다.
   ── 그래서 잠급니다. 링크는 카톡으로, 숫자 암호는 전화로 —
      따로 보내야 잠근 뜻이 있습니다.
   ── 압축(deflate) 후 암호화(AES-GCM). 브라우저 내장이라 라이브러리가
      필요 없습니다. 저장안 12개가 압축 후 약 1.9KB, 주소로는 약 2.5천자입니다.
   ══════════════════════════════════════════════════════════════════════ */
const b64u = {
  enc: b => btoa(String.fromCharCode(...new Uint8Array(b)))
              .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),
  dec: t => Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0))
};
async function deflateRaw(u8){
  if(typeof CompressionStream === "undefined") return null;
  const cs = new CompressionStream("deflate-raw");
  const w = cs.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function inflateRaw(u8){
  const ds = new DecompressionStream("deflate-raw");
  const w = ds.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
/* 숫자 암호는 짧으므로 늘려서 씁니다 — 링크를 주운 사람이 6자리를
   전부 시도하는 데 드는 시간을 늘리는 것이 목적입니다.               */
async function pinKey(pin, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin),
                                             "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
/* 담는 순서: [1바이트 압축여부][소금 16][IV 12][암호문] */
async function packLink(obj, pin){
  const raw  = new TextEncoder().encode(JSON.stringify(obj));
  const z    = await deflateRaw(raw);
  const body = z || raw;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const ct   = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv},
                                                          await pinKey(pin, salt), body));
  const out  = new Uint8Array(29 + ct.length);
  out[0] = z ? 1 : 0; out.set(salt,1); out.set(iv,17); out.set(ct,29);
  return b64u.enc(out);
}
async function unpackLink(code, pin){
  const u = b64u.dec(code);
  if(u.length < 30 || (u[0] !== 0 && u[0] !== 1)) throw new Error("형식");
  const pt = new Uint8Array(await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:u.slice(17,29)}, await pinKey(pin, u.slice(1,17)), u.slice(29)));
  return JSON.parse(new TextDecoder().decode(u[0] === 1 ? await inflateRaw(pt) : pt));
}

}

function shareText(text){
  if(navigator.share) navigator.share({text}).catch(()=>{});
  else copy(text);
}
/* 주소에서 암호문만 떼어 냅니다. 떼어 낸 뒤에는 주소창에서 지웁니다 —
   방문기록이나 어깨너머로 흘러가지 않게.                                  */
function linkCode(hash){
  const m = (hash || "").match(/^#d=([A-Za-z0-9\-_]+)$/);
  if(!m) return null;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  return m[1];
}
/* 앱을 이미 열어 둔 채로 링크를 누르면 새로 뜨지 않고 주소만 바뀝니다 —
   그때는 부트가 돌지 않으므로 여기서 받습니다.                            */
addEventListener("hashchange", ()=>{
  const c = linkCode(location.hash);
  if(c) openLink(c);
});

/* 받은 링크 열기 — 떼어 낸 암호문을 풉니다 */
async function openLink(code){
  const pin = await askText("받은 링크 열기",
    "이 링크는 숫자 암호로 잠겨 있습니다. 보낸 사람에게 들은 암호를 넣으십시오.",
    "", {ok:"열기", placeholder:"숫자 6자리"});
  if(pin === null) return;
  let d;
  try{ d = await unpackLink(code, String(pin).trim()); }
  catch(e){ return toast("암호가 다르거나 손상된 링크입니다"); }
  mergeSaved(d);
}

/* ══════════════════════════════════════════════════════════════════════════
   차익분석 (F-gain)
   ── 「지금 얼마가 필요한가」(현금흐름)보다 앞에 둡니다. 어떤 구조로 빌릴지가
      정해져야 시점별 배분도 정해지기 때문입니다.
   ── 이 화면의 입력은 분석 전용입니다. 보완대출을 「반영」으로 켤 때만
      대출·DSR·LTV 에 실제로 들어갑니다 (시점별 계획·계획서는 건드리지 않습니다).
   ══════════════════════════════════════════════════════════════════════════ */
const eok = n => (Math.round((Number(n)||0)/1e6)/100).toFixed(2) + "억";

/* 슬라이더는 끄는 동안 다시 그리지 않습니다 — 숫자만 바꾸고 놓을 때 한 번 갱신 */
function slideExit(k, v){
  S.fin.exit = Object.assign(exitCfg(), {[k]: Number(v)||0});
  save();
  document.querySelectorAll('[data-slide="'+k+'"]')
    .forEach(el=> el.textContent = (Number(v)||0) + "년");
}
function setExit(k, v){
  S.fin.exit = Object.assign(exitCfg(), {[k]: Number(v)||0});
  save(); render();
}
function toggleSuppOn(){
  const on = !suppCfg().on;
  S.fin.supplement = Object.assign(suppCfg(), {on});
  save(); render();
  toast(on ? "보완대출을 대출·DSR에 반영합니다" : "보완대출 반영을 껐습니다");
}
// 차이 칸 — 부호와 색을 함께 (많이 내는 쪽이 빨강)
function diffCell(d){
  if(!d) return "—";
  const c = d > 0 ? "var(--red)" : "var(--green)";
  return `<span style="color:${c}">${d>0?"+":""}${won(d)}</span>`;
}

function mGain(){
  /* 예전 저장안을 불러오면 fin 이 통째로 바뀌어 exit·supplement 가 사라집니다.
     입력칸이 빈 채로 표가 기본값으로 계산되는 어긋남을 막기 위해 여기서 채웁니다. */
  if(!S.fin.exit || !S.fin.supplement){
    S.fin.exit = exitCfg(); S.fin.supplement = suppCfg(); save();
  }
  const M = PROJECT.mortgage;
  const G = gainPlans(), E = exitCfg(), sc = suppCfg();
  const price = G.price;
  const baseSale = (S.fin.expectedSale > 0) ? S.fin.expectedSale
                                            : E.saleFrom + E.saleStep*2;
  const o = {hold:E.hold, children:E.children, sale:baseSale};
  const A = structOutcome(G.A, o), B = structOutcome(G.B, o);
  const BE = breakevenSale(A, B, price);
  const dA = planDsr(A), dB = planDsr(B);
  const LIM = Object.assign({dsr:40}, S.fin.limits||{}).dsr;
  const useJoint = !!S.me.spouseEmployed;
  const rA = useJoint ? dA.joint : dA.solo, rB = useJoint ? dB.joint : dB.solo;
  const okA = rA > 0 && rA <= LIM, okB = rB > 0 && rB <= LIM;
  const same = G.A.suppAmt <= 0;
  const netDiff = A.net - B.net;
  const winner = netDiff > 0 ? "A" : netDiff < 0 ? "B" : "=";

  /* 판정 띠 — 「어느 쪽이 남는가」보다 「애초에 되는가」가 먼저입니다 */
  const feas = same
    ? {c:"v-amber", t:"두 안이 같습니다",
       d:`목표 총 차입 ${E.targetLtv}%로는 가입한도 ${kwon(M.cap)}에 걸리지 않아 보완대출이 필요 없습니다. 목표를 올려 보십시오.`}
    : (!rA && !rB) ? {c:"v-amber", t:"소득을 넣으면 실행 가능성까지 판정합니다",
       d:"「내 정보」에서 연 소득을 입력하십시오."}
    : (!okA && !okB) ? {c:"v-red", t:"두 안 모두 실행이 어렵습니다",
       d:`A안 DSR ${rA.toFixed(1)}% · B안 ${rB.toFixed(1)}% (기준 ${LIM}%, ${useJoint?"부부합산":"본인 단독"} 소득). 아래 「실행 가능한 규모」를 보십시오.`}
    : (okA !== okB) ? {c:"v-amber", t:`${okA?"A안":"B안"}만 실행 가능합니다`,
       d:`A안 DSR ${rA.toFixed(1)}% · B안 ${rB.toFixed(1)}% (기준 ${LIM}%). 초과한 안의 손익은 참고용입니다.`}
    : {c:"v-green", t:"두 안 모두 DSR 기준 안에 들어옵니다",
       d:`A안 ${rA.toFixed(1)}% · B안 ${rB.toFixed(1)}% (기준 ${LIM}%).`};

  return `
  <section class="sec">
    <div class="verdict ${feas.c}">
      <div class="v-t">${feas.t}</div>
      <div class="tiny">${feas.d}</div>
    </div>
    <div class="note" style="margin-top:10px">
      같은 집을 <b>같은 총액</b>으로 사되 <b>빌리는 방법만</b> 다른 두 안을 비교합니다.
      A안은 이자를 더 내는 대신 팔 때 기금에 덜 냅니다.
      어느 쪽이 남는지는 <b>매도가</b>와 <b>보유기간</b>이 정합니다.
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>조건</h2>
      <span class="tiny muted">여기만 바꾸면 아래가 전부 따라옵니다</span></div>
    <div class="card pad">
      <label class="f">목표 총 차입 (주택가격 대비)</label>
      <div class="seg">
        ${[50,60,70].map(v=>`<button aria-selected="${E.targetLtv===v}"
          onclick="setExit('targetLtv',${v})">${v}%</button>`).join("")}
      </div>
      <div class="tiny muted" style="margin-top:5px">
        ${kwon(Math.floor(price/1000))} × ${E.targetLtv}% = <b>${won(G.target)}</b>
        ${G.capped ? ` · 모기지 한도 ${kwon(M.cap)}을 넘는 <b>${won(G.A.suppAmt)}</b>이 보완대출 몫입니다`
                   : " · 한도 안이라 보완대출이 필요 없습니다"}</div>

      <hr class="d">
      <div class="row"><label class="f" style="margin:0">보유기간 (대출 실행 후 매도까지)</label>
        <b data-slide="hold" style="font-variant-numeric:tabular-nums">${E.hold}년</b></div>
      <input type="range" min="1" max="30" step="1" value="${E.hold}"
        oninput="slideExit('hold',this.value)" onchange="render()">
      <div class="row tiny muted"><span>1년</span><span>15년</span><span>30년</span></div>
      ${E.hold < 5 ? `<div class="note e" style="margin-top:8px">
        전매제한 ${PROJECT.resaleYears}년${PROJECT.residencyDuty?" · 거주의무":""}가 있습니다.
        이 구간의 값은 <b>대출을 조기 전액상환하는 경우</b>에만 의미가 있습니다.</div>` : ""}

      <hr class="d">
      <label class="f">정산 시점의 자녀 수</label>
      <div class="seg">
        ${[0,1,2].map(n=>`<button aria-selected="${E.children===n}"
          onclick="setChildren(${n})">${n===2?"2명 이상":n+"명"}</button>`).join("")}
      </div>

      <hr class="d">
      <div class="grid2">
        ${numRow("기준 매도가","fin.expectedSale",
          {note: S.fin.expectedSale>0 ? "" : "미입력 — "+eok(baseSale)+" 기준으로 계산합니다"})}
        <div>
          <label class="f">보완대출 금리 <span style="font-weight:400;color:var(--ink-2)">(%)</span></label>
          <input type="number" step="0.001" min="0" inputmode="decimal" data-k="fin.supplement.rate"
            value="${sc.rate}" oninput="setNum('fin.supplement.rate',this.value,this)" onchange="render()">
          <div class="numhint">&nbsp;</div>
          <div class="tiny muted" style="margin-top:2px">비수익공유 · ${sc.years}년 · 거치 ${sc.grace}년</div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>구조 비교</h2>
      <span class="tiny muted">${E.hold}년 · 자녀 ${E.children}명 · 매도 ${eok(baseSale)}</span></div>
    <div class="card">
      <div class="stat" style="margin:0;border-radius:var(--r) var(--r) 0 0;
        background:${winner==="A"?"var(--green-soft)":winner==="B"?"var(--accent-soft)":"var(--gray-soft)"}">
        <span>${eok(baseSale)}에 판다면</span>
        <b style="color:${winner==="A"?"var(--green)":"var(--ink)"}">${
          winner==="=" ? "두 안이 같습니다"
          : (winner==="A"?"A안":"B안") + "이 " + won(Math.abs(netDiff)) + " 더 남습니다"}</b>
        <em>이자를 ${won(Math.abs(A.cumInterest-B.cumInterest))} 더 내고, 정산을 ${won(Math.abs(A.settle-B.settle))} 덜 냅니다</em>
      </div>
      <div class="tbl-wrap"><table class="cmp">
        <thead><tr><th>항목</th><th>A안 · 4억+보완</th><th>B안 · ${E.targetLtv}% 상향</th><th>차이</th></tr></thead>
        <tbody>
        <tr class="hd"><td colspan="4">빌리는 구조</td></tr>
        <tr><td>전용 모기지 (${pct(G.A.mortgageRate)}%)</td>
            <td>${won(G.A.mortgageAmt)}</td><td>${won(G.B.mortgageAmt)}</td><td>—</td></tr>
        <tr><td>보완대출 (${pct(sc.rate)}%)</td>
            <td>${won(G.A.suppAmt)}</td><td>0원</td><td>—</td></tr>
        <tr><td>수익공유 정산율${(A.interpolated||B.interpolated)?' <span class="badge b-gray">보간</span>':""}</td>
            <td>${A.share}%</td><td>${B.share}%</td>
            <td>${(A.share-B.share).toFixed(1)}%p</td></tr>

        <tr class="hd"><td colspan="4">내는 돈</td></tr>
        <tr><td>첫 1년 월납</td><td>${won(A.monthFirst)}</td><td>${won(B.monthFirst)}</td>
            <td>${diffCell(A.monthFirst-B.monthFirst)}</td></tr>
        <tr><td>2년차 이후 월납</td><td>${won(A.monthAfter)}</td><td>${won(B.monthAfter)}</td>
            <td>${diffCell(A.monthAfter-B.monthAfter)}</td></tr>
        <tr><td>${E.hold}년 누적이자</td><td>${won(A.cumInterest)}</td><td>${won(B.cumInterest)}</td>
            <td>${diffCell(A.cumInterest-B.cumInterest)}</td></tr>

        <tr class="hd"><td colspan="4">파는 때 (${eok(baseSale)} 가정)</td></tr>
        <tr><td>시세차익</td><td>${won(A.gain)}</td><td>${won(B.gain)}</td><td>—</td></tr>
        <tr><td>기금 정산액</td><td>${won(A.settle)}</td><td>${won(B.settle)}</td>
            <td>${diffCell(A.settle-B.settle)}</td></tr>
        <tr class="sum"><td>경제적 순시세차익</td>
            <td class="${winner==="A"?"win":"lose"}">${won(A.net)}</td>
            <td class="${winner==="B"?"win":"lose"}">${won(B.net)}</td>
            <td>${diffCell(netDiff)}</td></tr>

        <tr class="hd"><td colspan="4">실행 가능성</td></tr>
        <tr><td>DSR ${useJoint?"(부부합산)":"(본인 단독)"}</td>
            <td style="color:${okA?"var(--green)":"var(--red)"}">${rA?rA.toFixed(1)+"%":"—"}</td>
            <td style="color:${okB?"var(--green)":"var(--red)"}">${rB?rB.toFixed(1)+"%":"—"}</td>
            <td class="tiny muted">기준 ${LIM}%</td></tr>
        </tbody>
      </table></div>
    </div>
    <div class="tiny muted" style="margin-top:7px">
      <b>표를 옆으로 밀면 「차이」 칸이 나옵니다.</b><br>
      경제적 순시세차익 = 시세차익 − 기금 정산 − 누적이자.
      초기 자기자본과 잔여원금은 두 안 사이에서 상쇄되므로 총 차입액이 달라도 성립합니다.
      취득세·양도세·중개수수료는 넣지 않았습니다.</div>
  </section>

  ${same ? "" : `
  <section class="sec">
    <div class="sec-h"><h2>손익분기 매도가</h2></div>
    <div class="card pad">
      ${BE.none ? `<div class="verdict ${BE.always?"v-green":"v-red"}">
          <div class="v-t">${BE.always?"모든 매도가에서 A안이 유리":"이 조건에서는 A안이 이길 수 없습니다"}</div>
          <div class="tiny">${BE.why}</div></div>`
        : `<div class="stat" style="background:var(--accent-soft)">
          <span>이 금액을 넘으면 A안이 유리합니다</span>
          <b>${eok(BE.sale)}</b>
          <em>A안이 더 내는 이자 ${won(BE.dInt)} ÷ 정산율 차 ${(BE.dShare*100).toFixed(1)}%p</em>
        </div>
        <div class="tiny muted" style="margin-top:9px">
          매도가가 1억 오를 때마다 A안이 아끼는 정산액이
          <b>${won(Math.round(BE.dShare*100000000))}</b>씩 늘어납니다.
          누적이자 차이는 매도가와 무관하게 거의 고정이므로, 집값이 높을수록 A안이 유리해집니다.</div>`}
    </div>
  </section>`}

  <section class="sec">
    <div class="sec-h"><h2>매도가별 손익</h2>
      <span class="tiny muted">${E.hold}년 · 자녀 ${E.children}명</span></div>
    <div class="card">
      <div class="tbl-wrap"><table class="gsale">
        <thead><tr><th>매도가</th><th>시세차익</th><th>A안 순차익</th><th>B안 순차익</th><th>A안이 더 남는 돈</th></tr></thead>
        <tbody>
        ${Array.from({length:Math.max(1,Math.min(12,E.saleRows))},(_,i)=>{
          const sv = E.saleFrom + E.saleStep*i;
          const a = structOutcome(G.A, {hold:E.hold, children:E.children, sale:sv});
          const b = structOutcome(G.B, {hold:E.hold, children:E.children, sale:sv});
          const d = a.net - b.net;
          const cross = !BE.none && BE.sale && sv >= BE.sale
                        && (i === 0 || (E.saleFrom + E.saleStep*(i-1)) < BE.sale);
          return `<tr${cross?' class="on"':""}>
            <td>${eok(sv)}${sv<price?' <span class="tiny muted">손실</span>':""}</td>
            <td>${a.gain?eok(a.gain):"—"}</td>
            <td>${eok(a.net)}</td><td>${eok(b.net)}</td>
            <td style="color:${d>0?"var(--green)":"var(--red)"};font-weight:600">${d>0?"+":""}${won(d)}</td></tr>`;
        }).join("")}
        </tbody>
      </table></div>
      <div style="padding:12px 14px 14px">
        <div class="grid2">
          ${numRow("시작 매도가","fin.exit.saleFrom")}
          ${numRow("간격","fin.exit.saleStep")}
        </div>
      </div>
    </div>
    ${E.saleFrom < price ? `<div class="tiny muted" style="margin-top:7px">
      분양가(${eok(price)})보다 낮은 매도가는 시세차익이 없어 정산도 없습니다.
      <b>기금은 이익만 나누고 손실은 나누지 않습니다</b> — 그 구간의 순차익은 낸 이자만큼의 손실입니다.</div>` : ""}
  </section>

  ${same ? "" : `
  <section class="sec">
    <div class="sec-h"><h2>조건이 바뀌면</h2>
      <span class="tiny muted">칸의 값 = 손익분기 매도가</span></div>
    <div class="card">
      <div class="tbl-wrap"><table class="gsens">
        <thead><tr><th>보유</th><th>자녀 0명</th><th>자녀 1명</th><th>자녀 2명</th><th>A안 추가이자</th></tr></thead>
        <tbody>
        ${sensitivityGrid([5,10,15,20,25],[0,1,2]).map(r=>`
          <tr${r.hold===E.hold?' class="on"':""}><td>${r.hold}년</td>
          ${r.cells.map(c=> c.none
              ? `<td class="n">${c.always?"항상 A안":"—"}</td>`
              : `<td class="${c.sale<=baseSale?"g":"r"}">${eok(c.sale)}</td>`).join("")}
          <td class="tiny muted">${man(r.dInt)}원</td></tr>`).join("")}
        </tbody>
      </table></div>
    </div>
    <div class="cite" style="margin-top:9px">
      초록 = 기준 매도가 ${eok(baseSale)} 이하에서 이미 A안이 유리한 구간.<br>
      <b>오래 보유할수록 A안이 불리해집니다.</b> 정산표가 24년 구간에서 평평해져
      두 안의 정산율이 같아지는데, 이자 차이만 계속 쌓이기 때문입니다.<br>
      <b>자녀가 늘수록 A안이 불리해집니다.</b> 자녀 공제가 정산율이 높은 B안을 더 크게 깎습니다.</div>
  </section>`}

  <section class="sec">
    <div class="sec-h"><h2>월 상환액이 바뀌는 시점</h2>
      <span class="tiny muted">전용 모기지 1년 거치</span></div>
    <div class="card pad">
      ${[["A안 · 4억 + 보완대출", G.A], ["B안 · "+E.targetLtv+"% 상향", G.B]].map(([lab,pl])=>{
        const segs = paySegments(pl);
        if(!segs.length) return "";
        return `<div style="margin-bottom:14px">
          <div class="opt-name" style="margin-bottom:4px">${esc(lab)}</div>
          ${segs.map(g=>`<div class="kv">
            <span>${g.from}년 ~ ${g.to}년${g.from===0 && pl.mortgageGrace?" (거치)":""}</span>
            <b>${won(g.total)}/월</b></div>`).join("")}
        </div>`;
      }).join("")}
      <div class="tiny muted">
        전용 모기지는 1년 거치라 <b>2년차에 상환액이 뜁니다</b>.
        첫 1년 금액으로 생활비를 잡으면 2년차에 무너집니다.</div>
    </div>
  </section>

  ${same ? "" : `
  <section class="sec">
    <div class="sec-h"><h2>실행 가능한 규모</h2>
      <span class="tiny muted">DSR ${LIM}% 기준</span></div>
    <div class="card pad">
      ${(()=>{
        const need = G.A.suppAmt;
        const cap1 = solveSupplementByDsr(S.me.incomeSelf||0);
        const cap2 = useJoint
          ? solveSupplementByDsr((S.me.incomeSelf||0)+(S.me.incomeSpouse||0)) : 0;
        const best = useJoint ? cap2 : cap1;
        const short = Math.max(0, need - best);
        return `
        <div class="kv"><span>필요한 보완대출</span><b>${won(need)}</b></div>
        <div class="kv"><span>본인 단독 소득 기준</span>
          <b style="color:${cap1>0?"var(--ink)":"var(--red)"}">${won(cap1)}</b></div>
        ${useJoint?`<div class="kv"><span>부부합산 소득 기준</span>
          <b style="color:${cap2>0?"var(--ink)":"var(--red)"}">${won(cap2)}</b></div>`:""}
        <div class="verdict ${short>0?"v-red":"v-green"}" style="margin-top:10px">
          <div class="v-t">${short>0?won(short)+" 모자랍니다":"필요액을 조달할 수 있습니다"}</div>
          <div class="tiny">${short>0

      ${alloc.length ? alloc.map((a,i)=> a.auto ? `
        <div class="kv"><span>${esc(srcLabel(a.src))}

          <b>${won(a.amt)}</b></div>`

                const inForm = PROJECT.filingLines.some(l=>l.id===srcToLine(a.src));

            <div class="note i" style="margin-bottom:8px">

          ${(()=>{ /* 이 재원을 전 시점에 걸쳐 얼마나 쓰고 있는지 — 보유액과 대조 */
            const l = PROJECT.filingLines.find(x=>x.id===srcToLine(a.src));

      : `<div class="tiny muted">아직 배분한 재원이 없습니다.</div>`}
      <div class="kv" style="margin-top:4px">
        <span><b>배분 합계</b></span>

/* 지표 게이지 한 줄 — 값 / 기준선 / 통과 여부 */
function gaugeRow(label, value, limit){
  const over = value > limit;
  const col = over ? "var(--red)" : value > limit*0.9 ? "var(--amber)" : "var(--green)";
  return `
  <div class="gauge"><i style="width:${Math.min(100,value)}%;background:${col}"></i>
    <u style="left:${Math.min(100,limit)}%"></u></div>
  <div class="row tiny"><span class="muted">${esc(label)} · 기준 ${pct(limit)}%</span>
    <b style="color:${col};font-size:14px">${value.toFixed(1)}% ${over?"🔴 부결":"✅ 통과"}</b></div>`;
}

async function delLoan(i){
  const L = S.me.loans[i];
  if(L && (L.name || L.amount || L.limit)
     && !await askConfirm(`‘${L.name||"이름 없는 대출"}’ 삭제`,
          "이 대출을 목록에서 지웁니다. DSR·DTI 판정이 다시 계산됩니다.",
          {ok:"삭제", danger:true})) return;
  S.me.loans.splice(i,1); save(); render();
}
function setLoanType(i, t){
  const L = S.me.loans[i]; if(!L) return;
  // 마이너스통장은 한도, 그 밖에는 금액 — 칸이 바뀌므로 값을 옮겨 줍니다
  if(t==="line" && L.type!=="line"){ L.limit = L.limit || L.amount || 0; }
  if(t!=="line" && L.type==="line"){ L.amount = L.amount || L.limit || 0; }
  L.type = t; save(); render();
}

function setFiling(id, val, el){
  S.filing = S.filing || {};
  S.filing[id] = fromMan(val);
  save();
  if(el && el.parentNode){
    const h = el.parentNode.querySelector('[data-hint="filing.'+id+'"]');
    if(h) h.innerHTML = S.filing[id] ? won(S.filing[id]) : "&nbsp;";
  }
}

function chkRow(id, t, s, bag){

/* 입력 중에는 화면을 다시 그리지 않습니다.
   ─ oninput  : 값만 저장하고, 칸 아래 원단위 안내는 그 자리에서 글자만 갈아 끼웁니다.
                (다시 그리지 않으므로 커서가 움직이지 않습니다)
   ─ onchange : 칸을 벗어나거나 Enter를 누를 때 한 번만 전체를 갱신합니다.          */
function numRow(label, path, opts){
  if(opts === true) opts = {plain:true};
  opts = opts || {};
  const v = path.split(".").reduce((o,k)=>o?.[k], S) ?? "";
  return `
  <div>
    <label class="f">${esc(label)}${opts.plain?"":" <span style='font-weight:400;color:var(--ink-2)'>(만원)</span>"}${opts.badge||""}</label>
    <input type="number" data-k="${path}" value="${opts.plain ? v : toMan(v)}" placeholder="0"
      ${opts.plain ? 'inputmode="numeric"' : 'step="0.1" inputmode="decimal"'}
      oninput="${opts.plain?"setNum":"setMoney"}('${path}',this.value,this)" onchange="render()">
    ${opts.plain?"":`<div class="numhint" data-hint="${path}">${v?won(v):"&nbsp;"}</div>`}
    ${opts.note?`<div class="tiny muted" style="margin-top:2px">${opts.note}</div>`:""}
  </div>`;
}
function setNum(path, val, el){
  const ks = path.split("."); const last = ks.pop();
  let o = S; ks.forEach(k=> o = o[k] = o[k]||{});
  o[last] = Number(val)||0;
  save();
  if(el && el.parentNode){
    const h = el.parentNode.querySelector('[data-hint="'+path+'"]');
    if(h) h.innerHTML = o[last] ? man(o[last])+"원" : "&nbsp;";
  }
}
/* ── 입력 단위 ─────────────────────────────────────────────────────────────
   금액은 내부적으로 언제나 천원으로 저장합니다. 만원 단위를 고르면 화면에서만
   10으로 나눠 보여주고, 0.1만원(=1천원) 단위까지 입력받아 값이 깎이지 않습니다. */
function setMoney(path, val, el){
  const ks = path.split("."); const last = ks.pop();
  let o = S; ks.forEach(k=> o = o[k] = o[k]||{});
  o[last] = fromMan(val);
  save();
  if(el && el.parentNode){
    const h = el.parentNode.querySelector('[data-hint="'+path+'"]');
    if(h) h.innerHTML = o[last] ? won(o[last]) : "&nbsp;";
  }
}

function setText(path, val){
  const ks = path.split("."); const last = ks.pop();
  let o = S; ks.forEach(k=> o = o[k] = o[k]||{});
  o[last] = val; save();
}

/* ── 금리·이율 ──────────────────────────────────────────────────────────
   소수점 셋째 자리까지 입력합니다 (예: 1.325%, 5.875%).
   입력 중에는 다시 그리지 않고, 칸을 벗어날 때 한 번만 갱신합니다.        */
const RATE_STEP = "0.001";
function pct(v){
  const n = Number(v) || 0;

function rateRow(label, path, note){

    ${note?`<div class="tiny muted" style="margin-top:2px">${esc(note)}</div>`:""}

}

  .map(m=>`  ${ddayLabel(dday(m.d)).padEnd(7)} ${m.d.replaceAll("-",".")}  ${m.t}${m.fatal?"  [회복불가]":""}`).join("\n")}

[전매]  전매제한 만료 ${dotDate((PROJECT.milestones.find(m=>m.id==="m17")||{}).d||"")} (당첨자 발표일 + 3년)
        거주의무 5년은 별도로 적용 — 이행하지 않으면 LH 매입 신청 대상 (주택법 §57조의2 / 공고문 2·22쪽)`);
}

/* ══════════════════════════════════════════════════════════════════════════
   부트
   ══════════════════════════════════════════════════════════════════════════ */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-tab]");
  if(b){ TAB = b.dataset.tab; render({top:true}); }
});

document.documentElement.style.setProperty("--tabs", TABS.length);

/* 받은 링크(#d=…)는 탭 주소가 아닙니다 — 먼저 떼어 내고 기록에서도 지웁니다.
   주소창·방문기록에 암호문이 남아 있으면 어깨너머로 흘러갑니다.          */
const INBOX = linkCode(location.hash);

applyRoute();          /* 주소에 탭이 적혀 있으면 그 탭으로 엽니다 */
ensureCurrent();       /* 이미 입력값이 있는 저장본이면 바로 「내 안」을 붙입니다 */
forkUnsaved();
render();
pushRoute(true);       /* 첫 기록은 쌓지 않고 덮어씁니다 */

/* 브라우저가 자리 부족으로 저장소를 비우지 않게 못을 박습니다.
   크롬·안드로이드에서만 듣습니다 — 사파리는 홈 화면 추가가 유일한 방법입니다. */
navigator.storage?.persist?.().catch(()=>{});
if(NEWER) setTimeout(()=>toast("더 새 판에서 저장한 데이터입니다 — 최신 판으로 여십시오"), 400);
if(INBOX) setTimeout(()=>openLink(INBOX), 350);

</script>
