<style>
/* ══════════════════════════════════════════════════════════════════════════
   디자인 토큰 — e편한세상 분당 퍼스트빌리지 (브랜드 팔레트)
   ── 레이아웃: 폰에서는 한 열 + 아래 탭바, 넓은 화면(≥980px)에서는
      왼쪽 사이드바(로고·단지명·탭) + 오른쪽 본문 한 열(최대 720px).
   ── 색: 흰 바탕. 주색 Excellent Orange(PANTONE 165C)는 로고·주요 단추·
      선택 상태·진행 표시처럼 「면」에 씁니다. 작은 글자에는 쓰지 않습니다
      (흰 바탕 위 대비 2.9:1). 강조색 Excellent Blue(2755C)는 링크·보조 동작·
      기준일 배지에, 본문 글자색은 Excellent BlueGray(296C)입니다.
   ── 토큰 이름은 화면 코드(인라인 style 의 var(--ink-2) 등)와 맞춰 둡니다.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --brand:#FF671D;            /* Excellent Orange  255/103/29 */
  --brand-deep:#E35A13;       /* 누름·호버 */
  --brand-soft:rgba(255,103,29,.10);
  --brand-soft-2:rgba(255,103,29,.18);
  --accent:#191051;           /* Excellent Blue     25/16/81  */
  --accent-soft:rgba(25,16,81,.07);
  --ink:#051C2C;              /* Excellent BlueGray 5/28/44   */
  --ink-2:#556470;            /* 보조 글자 (대비 6.0:1) */
  --ink-3:#8F99A0;            /* 비활성·자리표시 */
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F6F8;
  --line:#E3E8ED; --line-2:#CBD4DB;
  --red:#C62828;    --red-soft:#FDECEC;
  --amber:#A64B00;  --amber-soft:#FFF1E6;
  --green:#1B7A3E;  --green-soft:#E6F4EA;
  --gray-soft:#EEF1F4; --press:#E4E9ED;
  --chrome:rgba(255,255,255,.92); --chrome-2:rgba(255,255,255,.94);
  --blur:saturate(160%) blur(16px);
  --ease:cubic-bezier(.32,.72,0,1);
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(5,28,44,.04);
  --tab-h:60px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
         "Apple SD Gothic Neo","Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font);
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum";
  letter-spacing:-.01em;
  word-break:keep-all; overflow-wrap:break-word;
}
b,strong{font-weight:700}
a{color:var(--accent)}
#shell{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 20px);
  position:relative}

/* ── 헤더 ── */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:40;
  background:var(--chrome);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);padding:12px 16px 10px}
.hd-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.hd-brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.hd-logo{flex:0 0 auto;width:46px;height:auto;display:block}
.hd-name{font-size:18px;font-weight:800;letter-spacing:-.025em;line-height:1.25;color:var(--ink)}
.hd-sub{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.hd-tab{display:none}
.hd-next{text-align:right;flex:none;white-space:nowrap}
.hd-next .hd-sub{margin:0}
.hd-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line)}
.hd-meta b{color:var(--ink);font-weight:600}

/* ── 홈의 안 박스 ── */
.pbox.cur{box-shadow:0 0 0 2px var(--brand) inset;border-color:transparent}
.pbox .pb-h{display:flex;align-items:center;gap:8px}
.pbox .pb-name{flex:1;min-width:0;font-size:17px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pbox .pb-ren{flex:0 0 auto;border:0;background:none;padding:6px;margin:-6px;
  font:inherit;font-size:14px;font-weight:600;color:var(--accent);cursor:pointer}

/* ── 탭바 (폰: 아래 고정) ── */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px)}
nav::before{content:"";position:absolute;inset:0;z-index:-1;
  background:var(--chrome-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.brand,.nav-foot{display:none}
.nav-in{max-width:640px;margin:0 auto;display:grid;
  grid-template-columns:repeat(var(--tabs,5),1fr);height:var(--tab-h)}
.nav-in button{background:none;border:0;cursor:pointer;color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:inherit;font-size:11.5px;font-weight:600;letter-spacing:0;padding:0;position:relative;
  transition:color .2s,transform .35s var(--ease),opacity .35s var(--ease)}
.nav-in button:active{transform:scale(.94);opacity:.7;transition-duration:0s}
.nav-in button svg{width:25px;height:25px;stroke-width:1.8}
.nav-in button[aria-selected=true]{color:var(--brand-deep)}
.nav-in button[aria-selected=true] svg{stroke-width:2.2;color:var(--brand)}
.nav-in button[aria-selected=true]::before{content:"";position:absolute;top:0;left:50%;
  width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--brand);transform:translateX(-50%)}

/* ── 레이아웃 ── */
main{padding:18px 16px 8px}
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  margin:0;display:flex;align-items:center;gap:8px;line-height:1.3}
.sec-h h2::before{content:"";flex:0 0 auto;width:4px;height:15px;border-radius:2px;background:var(--brand)}
.sec-h h2 .tiny{font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:10px}
.pad{padding:16px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink-2)}
.tiny{font-size:14px;line-height:1.55}
.sm{font-size:15px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
hr.d{border:0;border-top:1px solid var(--line);margin:14px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;
  background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* ── 배지 ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
  padding:2px 8px;border-radius:6px;white-space:nowrap;letter-spacing:0;line-height:1.5;vertical-align:middle}
.b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-gray{background:var(--gray-soft);color:var(--ink-2)}
.b-brand{background:var(--brand-soft);color:var(--brand-deep)}

/* ── 마일스톤 ── */
.ms{position:relative;display:flex;gap:12px;padding:14px 18px;cursor:pointer;
  transition:background-color .35s var(--ease)}
.ms:not(:last-child)::after{content:"";position:absolute;left:54px;right:0;bottom:0;
  height:1px;background:var(--line)}
.ms:active{background-color:var(--press);transition-duration:0s}
.ms.done{opacity:.6}
.ms-chk{flex:0 0 24px;height:24px;margin-top:2px;border-radius:12px;
  border:2px solid var(--line-2);
  display:grid;place-items:center;transition:.2s var(--ease);background:transparent}
.ms.done .ms-chk{background:var(--brand);border-color:var(--brand)}
.ms-chk svg{width:14px;height:14px;stroke:#fff;stroke-width:2.8;opacity:0}
.ms.done .ms-chk svg{opacity:1}
.ms-body{flex:1;min-width:0}
.ms-t{font-size:16.5px;font-weight:600;letter-spacing:-.015em;display:flex;gap:6px;
  align-items:center;flex-wrap:wrap;line-height:1.4}
.ms.done .ms-t{color:var(--ink-2)}
.ms-d{font-size:14px;color:var(--ink-2);margin-top:3px}
.ms-detail{margin-top:12px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r-sm);
  font-size:15px;line-height:1.65}
.ms-detail b{font-weight:600}
.ms-detail .k{color:var(--brand-deep);font-size:13px;font-weight:700;letter-spacing:.02em;
  display:block;margin:12px 0 3px}
.ms-detail .k:first-child{margin-top:0}
.dday{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}

/* ── 폼 ── */
label.f{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
label.f .tiny,label.f span{font-weight:400;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;min-height:46px;padding:11px 14px;border:1px solid var(--line-2);
  border-radius:var(--r-sm);background:var(--surface);color:var(--ink);
  font:inherit;font-size:16px;
  font-variant-numeric:tabular-nums;outline:none;
  transition:border-color .2s,box-shadow .2s}
@media(pointer:fine){
  input[type=text],input[type=number],input[type=date],select,textarea{
    min-height:40px;padding:8px 12px;font-size:15px}
}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-soft-2)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
button:focus:not(:focus-visible){outline:none}
textarea{min-height:84px;resize:vertical;line-height:1.55}
.numhint{margin-top:4px;min-height:18px;font-size:13.5px;line-height:1.35;color:var(--ink-2);
  font-variant-numeric:tabular-nums}

/* ── 칩 ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:baseline;gap:4px;font-size:13.5px;line-height:1.5;
  padding:4px 10px;border-radius:999px;background:var(--gray-soft);color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:600;color:var(--ink)}
.chip.auto{background:var(--accent-soft);color:var(--accent)}
.needs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.needs-k{font-size:12.5px;font-weight:700;color:var(--ink-2);flex:0 0 auto;margin-right:1px}
.chip.doc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.tap{border:0;background:var(--gray-soft);cursor:pointer;
  font:inherit;font-size:14px;padding:8px 14px;min-height:38px;
  transition:background-color .35s var(--ease),transform .35s var(--ease)}
.chip.tap:active{background:var(--press);transform:scale(.96);transition-duration:0s}
@media(pointer:coarse){ .chip.tap{min-height:42px} }
.chip.auto b{color:var(--accent)}
.chip.off{background:transparent;box-shadow:0 0 0 1px var(--line) inset;color:var(--ink-3)}
.chip.off b{color:var(--ink-3);font-weight:400}
button.chip{border:0;cursor:pointer;font:inherit;font-size:14px;padding:7px 13px;min-height:36px;
  color:var(--accent);background:var(--accent-soft);font-weight:600}

/* ── 좌우 2단 요약 ── */
.duo{display:grid;grid-template-columns:1fr 1fr}
.duo>div{padding:16px 16px;min-width:0}
.duo>div+div{border-left:1px solid var(--line)}
.duo .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.duo .big{font-size:clamp(18px,4.8vw,23px);font-weight:800;letter-spacing:-.03em;
  margin-top:3px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.duo .sub{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.duo .sub .kv{font-size:13.5px;padding:4px 0;border:0;flex-wrap:wrap}
.duo .sub .kv b{font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;min-height:46px;border-radius:var(--r-sm);border:1px solid transparent;
  background:var(--gray-soft);color:var(--ink);font:inherit;font-size:15.5px;font-weight:600;
  cursor:pointer;position:relative;letter-spacing:-.01em;
  transition:background-color .35s var(--ease),transform .35s var(--ease),opacity .35s var(--ease),filter .2s}
.btn:active{transform:scale(.97);opacity:.85;transition-duration:0s}
@media(pointer:fine){ .btn{min-height:40px;padding:8px 16px;font-size:15px} }
.btn.p{background:var(--brand);color:#fff;font-weight:700}
.btn.sm{padding:7px 12px;min-height:0;font-size:14px;border-radius:8px}
@media(pointer:coarse){
  .btn.sm::after{content:"";position:absolute;left:0;right:0;
    top:50%;transform:translateY(-50%);height:44px}
}
.sec-h .btn.sm{background:none;padding:0 2px;min-height:0;font-size:14.5px;font-weight:600;
  border-radius:0;color:var(--accent)}
.sec-h .btn.sm:active{transform:none;opacity:.5}
@media(hover:hover){ .sec-h .btn.sm:hover{filter:none;opacity:.75} }
.btn.w{width:100%}
.grid2>.btn,.grid3>.btn{font-size:14.5px;padding-left:10px;padding-right:10px;white-space:nowrap}
.grid3>.btn{font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:active{transform:none;opacity:.4}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2)}

/* ── 세그먼트 ── */
.seg{display:flex;gap:3px;background:var(--gray-soft);padding:3px;border-radius:11px;
  overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:7px 12px;border:0;background:none;border-radius:8px;
  font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:36px;
  transition:background-color .25s var(--ease),color .2s,transform .35s var(--ease)}
.seg button:active{transform:scale(.96);transition-duration:0s}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 3px rgba(5,28,44,.14),0 0 0 1px rgba(5,28,44,.05)}
@media(pointer:coarse){ .seg button{min-height:40px} }

/* ── 옵션 ── */
.opt-g{border-bottom:1px solid var(--line);padding:16px 18px}
.opt-g:last-child{border-bottom:0}
.opt-g > .row{margin-bottom:10px;align-items:flex-start}
.opt-name{font-size:15.5px;font-weight:700;letter-spacing:-.015em;line-height:1.4}
.opt-base{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line);cursor:pointer;background:var(--surface);margin-top:8px;
  transition:background-color .35s var(--ease),border-color .2s}
.opt:active{background-color:var(--press);transition-duration:0s}
.opt.on{background:var(--brand-soft);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.opt.off{opacity:.5;cursor:not-allowed}
.opt.off:active{background:var(--surface)}
.opt input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto}
.opt-l{flex:1;min-width:0;font-size:15px;line-height:1.5}
.opt-l b{font-weight:700}
.opt-p{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.opt-why{font-size:13.5px;color:var(--amber);margin-top:4px;line-height:1.5}
.opt-clear{color:var(--ink-2)}
.opt-clear[aria-hidden=true]{visibility:hidden}
.cat-h{display:flex;align-items:center;gap:8px;padding:12px 18px 6px;
  background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;
  border-bottom:1px solid var(--line)}
.cat-h .badge{font-size:11.5px}

/* ── 옵션 그림 ── */
.opt-img{flex:0 0 78px;width:78px;height:60px;border-radius:8px;object-fit:cover;
  background:var(--gray-soft);border:0;cursor:zoom-in;display:block}
.base-thumb{flex:0 0 54px;width:54px;height:44px;border-radius:6px;object-fit:cover;
  border:0;background:var(--gray-soft);cursor:zoom-in}
.opt-img.ph,.base-thumb.ph{display:grid;place-items:center;font-size:10px;color:var(--ink-3);
  text-align:center;line-height:1.2;cursor:default;padding:2px;overflow:hidden;font-weight:600}
.opt-img,.base-thumb,.plan-img{opacity:0;transition:opacity .22s ease}
.opt-img.rdy,.base-thumb.rdy,.plan-img.rdy,.opt-img.ph,.base-thumb.ph{opacity:1}
.plan-img{width:100%;max-width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#fff;cursor:zoom-in}

/* ── 모달 (바텀시트) ── */
.modal{position:fixed;inset:0;z-index:150;background:rgba(5,28,44,.42);display:none;
  align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal-box{background:var(--surface);width:100%;max-width:640px;max-height:88vh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -4px 32px rgba(5,28,44,.22)}
.modal-box::before{content:"";flex:0 0 auto;width:40px;height:5px;border-radius:3px;
  background:var(--line-2);margin:8px auto 0}
@media(min-width:640px){.modal{align-items:center;padding:20px}
  .modal-box{border-radius:18px;max-height:84vh;max-width:600px}
  .modal-box::before{display:none}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--surface)}
.modal-hd b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.modal-body{padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal-x{border:0;background:var(--gray-soft);color:var(--ink-2);width:32px;height:32px;
  border-radius:16px;font-size:16px;line-height:1;cursor:pointer;flex:0 0 auto;
  transition:transform .35s var(--ease),background-color .35s var(--ease)}
.modal-x:active{transform:scale(.9);background:var(--press);transition-duration:0s}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);cursor:pointer;font:inherit;text-align:left;color:var(--ink);
  transition:background-color .35s var(--ease)}
.linkrow:active{background-color:var(--press);transition-duration:0s}
.linkrow .lr-l{font-size:15.5px;font-weight:700}
.linkrow .lr-s{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.linkrow .lr-r{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent)}
.linkrow.next{border-color:var(--brand);background:var(--brand-soft)}

/* ── 저장 불가 경고 띠 ── */
#nosave{background:var(--amber-soft);border-bottom:1px solid var(--amber);
  color:var(--ink);font-size:15px;line-height:1.55;padding:12px 16px}
#nosave[hidden]{display:none}
#nosave b{color:var(--amber)}
#nosave .lnk{border:0;background:none;padding:0;font:inherit;color:var(--accent);
  text-decoration:underline;cursor:pointer}

#lb{position:fixed;inset:0;z-index:200;background:rgba(5,28,44,.96);display:none}
#lb.on{display:block}
#lb .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:18px;cursor:zoom-out;touch-action:none;overscroll-behavior:contain}
#lb img{max-width:100%;max-height:82vh;border-radius:10px;display:block;background:#fff;
  transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
#lb.z .stage{cursor:grab}
#lb.z.drag .stage{cursor:grabbing}
#lb .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;
  font-size:15px;font-weight:500;padding:0 20px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  pointer-events:none}
#lb .tools{position:absolute;right:12px;z-index:2;display:flex;gap:8px;
  top:calc(12px + env(safe-area-inset-top, 0px))}
#lb .tools button{min-width:44px;height:44px;padding:0 12px;border-radius:22px;cursor:pointer;
  border:0;background:rgba(255,255,255,.18);color:#fff;
  font-size:16px;font-weight:600;font-family:inherit;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:transform .35s var(--ease),background-color .35s var(--ease)}
#lb .tools button:active{background:rgba(255,255,255,.35);transform:scale(.92);transition-duration:0s}

/* ── 금액 바 ── */
.pricebar{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));z-index:30;
  margin:0 -16px;padding:12px 16px 14px;
  background:var(--chrome-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(5,28,44,.05)}
.pricebar .tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pricebar .tot b{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.planbar{margin-bottom:14px}
.planbar .seg button{flex:0 1 auto;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.planbar .seg button.add{flex:0 0 auto;color:var(--brand-deep)}
.planbar .pl-sum{margin:6px 4px 0;font-size:13.5px;color:var(--ink-2)}
.step{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;
  border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.step:last-child{border-bottom:0}
.step-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;background:var(--gray-soft);color:var(--ink-2)}
.step.cur .step-n{background:var(--brand);color:#fff}
.step.done .step-n{background:var(--green);color:#fff}
.step.done b{color:var(--ink-2);font-weight:500}
.step-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.step-b b{font-size:16px}
.step-go{flex:none;font-size:14px;color:var(--ink-2);font-weight:600}
.step.cur .step-go{color:var(--brand-deep)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar b{font-size:16px}
.ms-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ms-tools .btn.sm{background:var(--surface);border-color:var(--line-2);color:var(--accent)}
.pb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.pb-grid div{text-align:center;min-width:0}
.pb-grid span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pb-grid b{display:block;font-size:14px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

/* ── 선택 내역 한 줄 ── */
.bill-i{padding:12px 18px;border-bottom:1px solid var(--line)}
.bill-i:last-child{border-bottom:0}
.bill-n{flex:1;min-width:0;font-size:15px;line-height:1.5}
.bill-b{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.bill-b b{margin-left:4px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bill-sum .bill-tot{font-size:18px}

/* ── 표 ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:0;
  background:var(--surface-2);line-height:1.35}
th:first-child,td:first-child{text-align:left;white-space:normal}
tbody tr:last-child td{border-bottom:0}
tr.sum td{font-weight:700;background:var(--surface-2)}
tr.on td{background:var(--brand-soft)}
th.me,td.me{background:var(--brand-soft);color:var(--ink)}
table.tight th,table.tight td{padding:9px 10px;font-size:14px}
.type-tbl td{padding-top:12px;padding-bottom:12px}
.type-tbl tr{cursor:pointer}
.type-tbl td b{font-size:16px}
.type-tbl td:first-child{white-space:nowrap}
.type-tbl tr.on td:first-child{box-shadow:inset 4px 0 0 var(--brand)}

/* ── 차익분석 ── */
input[type=range]{width:100%;height:30px;margin:2px 0 0;padding:0;background:none;
  -webkit-appearance:none;appearance:none;cursor:pointer;border:0}
input[type=range]:focus{box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--gray-soft)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--gray-soft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  margin-top:-10.5px;border-radius:50%;background:var(--brand);border:3px solid #fff;
  box-shadow:0 1px 4px rgba(5,28,44,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:3px solid #fff;border-radius:50%;
  background:var(--brand);box-shadow:0 1px 4px rgba(5,28,44,.3)}
.cmp{font-size:13.5px}
.cmp th,.cmp td{padding:9px 10px}
.cmp td:first-child,.cmp th:first-child{white-space:nowrap}
.cmp td.win{color:var(--green);font-weight:700}
.cmp td.lose{color:var(--ink-2)}
.cmp tr.hd td{background:var(--surface-2);font-size:13px;color:var(--ink-2);font-weight:700;
  padding-top:12px;padding-bottom:6px;border-bottom:0}
.gsale td:first-child,.gsens td:first-child{white-space:nowrap}
.gsens td{font-variant-numeric:tabular-nums}
.gsens td.g{background:var(--green-soft);color:var(--green);font-weight:700}
.gsens td.r{background:var(--red-soft);color:var(--red)}
.gsens td.n{color:var(--ink-3)}

/* ── 판정/알림 ── */
.verdict{padding:16px 18px;border-radius:var(--r);border:1px solid transparent;line-height:1.55}
.v-red{background:var(--red-soft);border-color:rgba(198,40,40,.18)}
.v-amber{background:var(--amber-soft);border-color:rgba(166,75,0,.18)}
.v-green{background:var(--green-soft);border-color:rgba(27,122,62,.18)}
.v-t{font-size:16.5px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.v-red .v-t{color:var(--red)}
.v-amber .v-t{color:var(--amber)}
.v-green .v-t{color:var(--green)}
.cite{font-size:13.5px;color:var(--ink-2);line-height:1.6;padding-left:12px;
  border-left:3px solid var(--brand-soft-2);margin-top:10px}
.note{padding:13px 16px;border-radius:var(--r-sm);font-size:15px;line-height:1.6;
  background:var(--amber-soft);color:var(--ink)}
.note.i{background:var(--accent-soft)}
.note.e{background:var(--red-soft)}

/* ── 스탯 ── */
.pricerow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;margin-top:12px;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);
  font:inherit;text-align:left;cursor:pointer;
  transition:background-color .35s var(--ease)}
.pricerow:active{background-color:var(--press);transition-duration:0s}
.pricerow b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin:2px 0;line-height:1.2}
.pricerow .pr-more{flex:0 0 auto;font-size:14.5px;font-weight:600;color:var(--accent)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.stat span{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px;line-height:1.25;
  font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.45}

/* ── 게이지 ── */
.gauge{height:8px;border-radius:4px;background:var(--gray-soft);overflow:hidden;
  margin:8px 0 4px;position:relative}
.gauge>i{display:block;height:100%;border-radius:4px;transition:width .4s var(--ease)}
.gauge>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);opacity:.8}

/* ── 체크리스트 ── */
.chk{position:relative;display:flex;gap:12px;align-items:flex-start;padding:13px 18px;
  cursor:pointer;transition:background-color .35s var(--ease)}
.chk:not(:last-child)::after{content:"";position:absolute;left:50px;right:0;bottom:0;
  height:1px;background:var(--line)}
.chk:active{background-color:var(--press);transition-duration:0s}
.chk input{margin:4px 0 0;width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto}
.chk.done .chk-t{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--line-2)}
.chk-t{font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.45}
.chk-s{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}

details.acc{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
details.acc + details.acc{margin-top:8px}
details.acc summary{padding:12px 16px;cursor:pointer;font-size:15px;font-weight:700;
  list-style:none;min-height:46px;display:flex;align-items:center;
  transition:background-color .35s var(--ease)}
details.acc summary:active{background-color:var(--press);transition-duration:0s}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:"▸ ";color:var(--brand)}
details.acc[open] summary::before{content:"▾ "}
details.acc .acc-b{padding:0 16px 14px;font-size:15px;line-height:1.6;color:var(--ink-2)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:15px;line-height:1.5}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv span{color:var(--ink-2)}
.kv span b{color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 24px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;
  font-weight:600;z-index:99;opacity:0;pointer-events:none;
  transition:.3s var(--ease)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

.ext-link{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;text-decoration:none;
  border-bottom:1px solid rgba(25,16,81,.3)}
.ext-link:hover{border-bottom-color:var(--accent)}

@media(hover:hover){
  .btn:hover{filter:brightness(.97)}
  .btn.p:hover{background:var(--brand-deep);filter:none}
  .btn.danger:hover{filter:brightness(1.08)}
  .chip.tap:hover{background:var(--press);color:var(--accent)}
  .opt:hover{background:var(--surface-2)}
  .opt.on:hover{background:var(--brand-soft)}
  .opt.off:hover{background:var(--surface)}
  .linkrow:hover,.pricerow:hover,.ms:hover,.chk:hover{background-color:var(--surface-2)}
  .linkrow.next:hover{background:var(--brand-soft-2)}
}

/* ── 넓은 화면: 사이드바 + 본문 ── */
@media(min-width:980px){
  body{font-size:16px}
  #shell{max-width:1080px;display:grid;grid-template-columns:272px minmax(0,1fr);
    grid-template-areas:"nav header" "nav main";align-items:start;padding-bottom:48px}
  nav{grid-area:nav;position:sticky;top:0;bottom:auto;left:auto;right:auto;height:100vh;height:100dvh;
    border-top:0;border-right:1px solid var(--line);padding:32px 20px 24px;display:flex;flex-direction:column;gap:24px;
    overflow-y:auto}
  nav::before{display:none}
  .brand{display:block;padding:0 10px}
  .brand .hd-logo{width:76px;margin-bottom:14px}
  .brand .b-name{font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.3}
  .brand .b-sub{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.5}
  .nav-in{display:flex;flex-direction:column;height:auto;gap:4px;max-width:none;margin:0}
  .nav-in button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15.5px;font-weight:600;
    padding:11px 14px;border-radius:10px;color:var(--ink-2)}
  .nav-in button svg{width:22px;height:22px}
  .nav-in button[aria-selected=true]{background:var(--brand-soft);color:var(--ink)}
  .nav-in button[aria-selected=true]::before{display:none}
  .nav-foot{display:block;margin-top:auto;padding:0 10px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .nav-foot .nav-by{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
  header{grid-area:header;padding:18px 36px 14px}
  .hd-brand .hd-logo,.hd-brand .hd-name,.hd-brand .hd-sub{display:none}
  .hd-tab{display:block;font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.3}
  main{grid-area:main;padding:28px 36px 24px;max-width:760px;width:100%}
  .pricebar{bottom:0;margin:0 -36px;padding:14px 36px 16px}
  .toast{bottom:32px}
  #nosave{grid-column:2}
}

@media print{
  nav,.pricebar,header{position:static}
  nav,.btn,.seg,.toast{display:none!important}
  #shell{max-width:none;padding:0;display:block}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .ms:not(:last-child)::after,.chk:not(:last-child)::after{background:#ddd}
}

/* ══════════════════════════════════════════════════════════════════════════
   L3 · 룰 (RULES) — 법령·금융 판정 규칙
   ══════════════════════════════════════════════════════════════════════════ */
const RULES = {
  /* ── 상환 스케줄 (원리금균등 · 거치 지원) ────────────────────────────────
     grace 년 동안은 이자만 내고, 남은 (years-grace) 년을 원리금균등으로 갚습니다.
     공고문 11쪽 「1년거치 29년 원리금균등분할상환」이 이 구조입니다.
     horizon 년까지의 누적이자와 그 시점의 잔액을 함께 돌려줍니다.
     ── 누적이자·월납 단차·중도 잔액이 전부 여기서 나옵니다 (차익분석).      */
  schedule(principal, ratePct, years, graceYears, horizonYears){
    const P = Number(principal)||0;
    const y = Number(years)||0;
    const g = Math.max(0, Math.min(Number(graceYears)||0, y));
    const h = Math.max(0, Number(horizonYears)||0);
    if(!P || !y) return {pay:0, gracePay:0, annual:0, cumInterest:0,
                         cumPaid:0, balance:0, paidOff:true};
    const i  = (Number(ratePct)||0)/100/12;
    const n  = Math.round((y-g)*12);          // 원리금균등 회차
    const gm = Math.round(g*12);              // 거치 회차
    const pay = i === 0 ? (n ? P/n : 0)
              : P * i*Math.pow(1+i,n) / (Math.pow(1+i,n)-1);
    let bal = P, cum = 0, paid = 0;
    const months = Math.min(Math.round(h*12), gm + n);
    for(let m=0; m<months; m++){
      const it = bal*i;
      cum += it;
      if(m < gm){ paid += it; }                // 거치기간: 이자만
      else      { paid += pay; bal -= (pay - it); }
    }
    if(bal < 1) bal = 0;
    return {pay:Math.round(pay), gracePay:Math.round(P*i),
            annual:Math.round(pay*12), cumInterest:Math.round(cum),
            cumPaid:Math.round(paid), balance:Math.round(bal),
            paidOff: months >= gm + n};
  },

  // 원리금균등 연간 상환액 — 거치 없는 경우의 schedule 과 같습니다
  annuity(principal, ratePct, years){
    if(!principal || !years) return 0;
    return RULES.schedule(principal, ratePct, years, 0, years).annual;
  },

  /* DTI — 주택담보대출은 연 원리금 전액, 그 밖의 대출은 연 이자만 더합니다.
     (DSR 은 모든 대출의 원리금을 더하므로 DTI 보다 크게 나옵니다)          */
  dti(rows, income){
    let annual = 0;
    rows.forEach(L=>{
      annual += (L.type === "mortgage" || L.type === "supplement")
        ? L.annual                       // 주담대·보완대출: 원리금 전액
        : L.base * (L.rate/100);         // 신용·마통: 이자만 (마통은 한도 기준)
    });
    return {annual, ratio: income>0 ? annual/income*100 : 0};
  },

  // DSR — 마이너스통장은 한도 전액을 5년 원리금균등으로 산입
  dsr(loans, income){
    let annual = 0;
    const rows = loans.map(L=>{
      const base = L.type==="line" ? L.limit : L.amount;
      const yrs  = L.type==="line" ? 5 : L.years;
      // 거치식은 거치 후 원리금이 DSR 산입액입니다 (전용 모기지 1년거치 29년)
      const a = RULES.schedule(base, L.rate, yrs, L.grace||0, yrs).annual;
      annual += a;
      return {...L, base, yrs, annual:a};
    });
    return {rows, annual, ratio: income>0 ? annual/income*100 : 0};
  },

  // 유상취득 취득세 (주택)
  acquisitionTax(price, exclusiveArea, firstTime){
    const eok = price/100000000;
    let rate, band;
    if(eok <= 6){ rate = 0.01; band = "6억원 이하 · 1%"; }
    else if(eok <= 9){
      rate = (eok*2/3 - 3)/100;
      band = "6억 초과 9억 이하 · (취득가액(억)×2÷3−3)%";
    } else { rate = 0.03; band = "9억원 초과 · 3%"; }
    rate = Math.round(rate*1e7)/1e7;
    const acq = Math.floor(price*rate);
    const eduTax = Math.floor(price*rate*0.5*0.2);            // 지방교육세
    const ruralTax = exclusiveArea > 85 ? Math.floor(price*0.002) : 0;  // 농특세 (85㎡ 초과만)
    const relief = firstTime ? Math.min(2000000, acq) : 0;     // 생애최초 감면 최대 200만
    return {rate, band, eok, acq, eduTax, ruralTax, relief, total: acq + eduTax + ruralTax - relief};
  },

  // 비영업대금의 이익 (차용증 이자소득)
  interestTax(interest){
    const income = Math.floor(interest*0.25);          // 소득세 25%
    const local  = Math.floor(income*0.1);             // 지방소득세 10% (=2.5%)
    return {income, local, total:income+local, rate:27.5};
  },

  /* ── 수익공유 정산비율 (%) — 2D 선형보간 ────────────────────────────────
     정산표는 담보인정비율 5눈금(30~70) × 경과연수 4구간(9/14/19/24)의 격자입니다.
     4억 한도로 잘리면 실제 LTV가 눈금에 걸리지 않고(48.4%), 보유기간도
     구간 사이(15년)에 떨어집니다. 두 축 모두 인접 값 사이를 직선으로 잇습니다.
     격자 밖은 가장 가까운 눈금으로 고정합니다 — 외삽하지 않습니다.
     ⚠ 공고문에 보간 규정은 없습니다. 실제 정산율은 취급은행 확인이 필요합니다. */
  mortgageShare(ltv, years, children){
    const M  = PROJECT.mortgage;
    const ch = Math.min(2, Math.max(0, Math.round(Number(children)||0)));
    const LS = M.ltvChoices;                       // [30,40,50,60,70]
    const YS = M.shareBands.map(b=>b.k);           // [9,14,19,24]
    const L  = Math.max(LS[0], Math.min(LS[LS.length-1], Number(ltv)||0));
    const Y  = Math.max(YS[0], Math.min(YS[YS.length-1], Number(years)||0));
    const lerp = (a,b,t)=> a + (b-a)*t;
    const atYear = yk => {                         // 한 연차 구간에서 LTV 보간
      const row = M.shareTable[yk];
      const lo = LS.filter(v=>v<=L).pop();
      const hi = LS.find(v=>v>=L);
      if(lo === hi) return row[lo][ch];
      return lerp(row[lo][ch], row[hi][ch], (L-lo)/(hi-lo));
    };
    const ylo = YS.filter(v=>v<=Y).pop();
    const yhi = YS.find(v=>v>=Y);
    const raw = (ylo === yhi) ? atYear(ylo)
              : lerp(atYear(ylo), atYear(yhi), (Y-ylo)/(yhi-ylo));
    return Math.round(raw*10)/10;                  // 소수 첫째 자리
  },
  // 격자 안에서 보간이 실제로 일어났는지 (화면에 「보간값」 배지를 붙일지 판단)
  shareIsInterpolated(ltv, years){
    const M = PROJECT.mortgage;
    const onLtv  = M.ltvChoices.includes(Math.round(ltv*100)/100);
    const onYear = M.shareBands.map(b=>b.k).includes(Number(years))
                   || Number(years) <= 9 || Number(years) >= 24;
    return !(onLtv && onYear);
  },

  // 자금조달계획서 소명 리스크
  filingRisk(lines, total, declared, income3y){
    const R = [];
    const g = id => Number(lines[id]||0);
    const self = ["L2","L3","L4","L5","L6"].reduce((s,k)=>s+g(k),0);
    const loan = ["L8","L8b","L8c","L9","L10","L11"].reduce((s,k)=>s+g(k),0);
    if(Math.abs(total-declared) > 0)
      R.push({lv:"red", t:"신고금액 불일치",
        d:`계획서 합계 ${won(total)} ≠ 신고금액 ${won(declared)} (차 ${won(total-declared)}). 반드시 일치시켜야 합니다.`});
    if(g("L4") > 0)
      R.push({lv:"red", t:"④ 증여·상속 기재",
        d:"편법증여 심사의 1순위 칸입니다. 증여세 신고서와 실제 이체내역이 함께 요구됩니다."});
    if(g("L11") > 0)
      R.push({lv:"red", t:"⑪ 그 밖의 차입금 기재",
        d:"특수관계인 차입으로 분류되면 차용증·이자 지급내역·상환능력 증빙이 요구됩니다. 이자 지급 사실이 확인되면 대여자의 이자소득세 신고 여부도 함께 검토됩니다."});
    if(income3y > 0 && g("L2") > income3y)
      R.push({lv:"amber", t:"② 예금액이 최근 소득 합계를 초과",
        d:`예금 ${won(g("L2"))} > 소득 합계 ${won(income3y)}. 자금 형성 과정을 보여줄 통장내역이 요구될 수 있습니다.`});
    if(total>0 && loan/total > 0.7)
      R.push({lv:"amber", t:"차입금 비중 70% 초과",
        d:`차입 비중 ${(loan/total*100).toFixed(1)}%. LTV·DSR 충족 여부와 대출 실행 가능성이 함께 확인됩니다.`});
    if(total>0 && self/total < 0.2)
      R.push({lv:"amber", t:"자기자금 비율 20% 미만",
        d:`자기자금 ${(self/total*100).toFixed(1)}%. 잔금 미납 위험 관점에서 소명 요구 가능성이 높아집니다.`});
    if(!R.length)
      R.push({lv:"green", t:"두드러진 트리거 없음",
        d:"다만 투기과열지구이므로 계약 시 증빙자료 제출이 의무이며, 잔금 이후에도 자료제출 요구가 가능합니다 (부동산거래신고법 §6)."});
    return {risks:R, self, loan};
  }
};

/* 배포본입니다 — 개인 시드 데이터가 들어 있지 않습니다.
   빈 상태로 시작하며, 「프로젝트 파일에서 불러오기」로 값을 가져올 수 있습니다.
   시드 전용 버튼은 화면 코드가 SEED 를 보고 스스로 감춥니다. */
const SEED = null;

/* ══════════════════════════════════════════════════════════════════════════
   L2 · 상태 (온디바이스 · localStorage)
   ══════════════════════════════════════════════════════════════════════════ */
const SCHEMA = 5;                     // 저장 형식 버전 (5 = 나/안 분리 · 프로필 폐지)

/* ══════════════════════════════════════════════════════════════════════
   L2a · 저장 키 (v7)
   ── v6 은 「한 기기를 여러 사람이 쓴다」고 보고 키를 사람별로 나눴습니다
      (ipju:<단지>:<사람>). 실제로는 한 사람이 자기 폰에서만 씁니다.
      여러 개가 필요한 것은 사람이 아니라 자금조달방안이었습니다 —
      그건 저장 키가 아니라 S.saved 가 맡습니다.
   ── 그래서 키를 다시 하나로 되돌립니다. 쓰던 사람 것은 그대로 옮겨 옵니다.
   ══════════════════════════════════════════════════════════════════════ */
const KEY = "ipju:" + PROJECT.id;

/* v6 → v7 — 프로필별 키를 하나로 합칩니다.
   보고 있던 사람(ipju:profiles 의 cur) 것만 가져오고, 나머지 사람 것은
   지우지 않고 그대로 둡니다 — 착오로 지우면 되돌릴 방법이 없습니다.      */
(function(){
  try{
    if(localStorage.getItem(KEY)) return;          // 이미 옮겼거나 v5 이하
    const p = JSON.parse(localStorage.getItem("ipju:profiles") || "null");
    const cur = p && p.cur ? p.cur : "p1";
    const raw = localStorage.getItem(KEY + ":" + cur)
             || localStorage.getItem(KEY + ":p1");
    if(raw){ localStorage.setItem(KEY, raw); localStorage.removeItem("ipju:profiles"); }
  }catch(e){}
})();
const BLANK = {
  /* ── 나 (v7) ──────────────────────────────────────────────────────────
     안(案)을 바꿔도 그대로 남는 값입니다. 소득과 이미 지고 있는 대출은
     사람에게 딸린 사실이지, 자금조달방안마다 달라지는 값이 아닙니다.
     예전에는 이것이 fin 안에 섞여 있어서, 2안을 만들면 소득까지 복제되고
     1안에서 소득을 고쳐도 2안에는 반영되지 않았습니다.                    */
  me:{incomeSelf:0, incomeSpouse:0, spouseEmployed:false, income3y:0, income3ySpouse:0,
      acqFirstTime:true, children:0, loans:[],
      /* 보유 자산 — 「지금 얼마를 갖고 있나」입니다.
         ── 이름은 쓰는 말 그대로 적고(청약통장·전세보증금·부모님 지원),
            분류만 자금조달계획서 항목에 맞춥니다. 그래야 시점별 배분에서
            「이 재원으로 얼마까지 쓸 수 있나」를 대조할 수 있습니다.
         ── 시점은 받지 않습니다. 지금 잔액 하나만 봅니다.                */
      assets:[]},
  sel:{type:"55A", floor:4, space:"base", minus:false, opts:{}},
  fin:{mortgage:{enabled:true, ltv:30, years:30, children:0, band:24, rate:1.3}, expectedSale:0,
       /* 차익분석 — 보완대출(가정 상품)과 매도 시나리오.
          두 값 모두 분석 전용이며 시점별 자금 계획·계획서에는 들어가지 않습니다. */
       supplement:{on:false, mode:"fill70", amount:0, rate:3.5, years:30, grace:0},
       exit:{hold:15, children:0, targetLtv:70,
             saleFrom:1300000000, saleStep:100000000, saleRows:6},
       bondRate:8, judicial:700000, stamp:150000, mgmtDeposit:600000,
       midRate:4.5, midMonths:10, limits:{ltv:70, dti:60, dsr:40}},
  filing:{}, loanNote:{principal:0, rate:0, monthly:0, start:"", balance:0, years:5},
  role:"pre",                  /* 신청 유형 — pre 사전청약 당첨자 / bon 본청약 당첨자 */
  done:{}, docs:{}, notes:{}, saved:[], plan:{},
  cur:null,                    /* 지금 편집 중인 저장안의 id */
  v:SCHEMA
};
/* v6 까지 fin 안에 섞여 있던 「나」의 값 — v7 에서 me 로 옮깁니다.
   ⚠ 반드시 load() 호출보다 위에 있어야 합니다. migrate() 는 함수라 끌어올려지지만
     const 는 아니라서, 아래에 두면 첫 로드에서 ReferenceError 가 납니다.
     그 오류는 load() 의 catch 가 삼키고 빈 상태를 돌려주므로 — 화면은 멀쩡한데
     쓰던 값이 전부 사라진 것처럼 보입니다. 실제로 그렇게 한 번 깨졌습니다.   */
const ME_FROM_FIN = ["incomeSelf","incomeSpouse","spouseEmployed","income3y",
                     "acqFirstTime","loans"];

let NEWER = false;              /* 앞선 판에서 저장한 데이터인가 */
/* 저장본이 있는데 온전히 읽지 못했습니다 — 그 위에 덮어쓰지 않습니다.
   읽기에 실패하면 화면은 빈 상태로 뜨는데, 그대로 두면 창을 닫을 때
   pagehide → saveNow 가 그 빈 상태를 원본 위에 씁니다. 되돌릴 수 없습니다. */
let LOADFAIL = false;
let S = load();
function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(BLANK);
    const parsed = JSON.parse(raw);
    const s = Object.assign(structuredClone(BLANK), parsed);
    // 병합하면 BLANK 의 최신 버전이 덮어써 버리므로, 저장본의 버전을 되살립니다
    s.v = Number(parsed.v) || 0;
    /* 더 새 판이 만든 저장본입니다 — 낮춰 읽으면 모르는 항목을 지우게 됩니다.
       그대로 두고 화면에 알립니다.                                        */
    if(s.v > SCHEMA){ NEWER = true; return s; }
    return migrate(s);
  }catch(e){
    if(raw){ LOADFAIL = true; console.error("저장본을 읽지 못했습니다 —", e); }
    return structuredClone(BLANK);
  }
}
/* 이전 버전 호환 — 전용 모기지를 대출 목록에 직접 넣어 두었던 데이터를
   모기지 설정으로 옮깁니다 (그대로 두면 DSR·조달액이 이중 계산됩니다).   */
function migrate(s){
  const f = s.fin || (s.fin = {});
  const i = (f.loans||[]).findIndex(L=>/모기지/.test(L.name||""));
  if(i >= 0){
    const old = f.loans[i];
    if(!f.mortgage || f.mortgage.__migrated !== true){
      // 이 시점엔 옵션 선택이 확정되지 않았으므로 기준가 + 발코니 확장비로 근사합니다
      const T = PROJECT.types[0];
      const price = (T.floors.slice(-1)[0].price + T.balcony.price) || 1;
      const M2 = PROJECT.mortgage;
      const ltv = M2.ltvChoices
        .find(v => Math.min(Math.floor(price*v/100), M2.cap) >= (old.amount||0)) || M2.minLtv;
      f.mortgage = {enabled:true, ltv, years:old.years||30, children:0, band:24, __migrated:true};
    }
    f.loans.splice(i,1);
  }
  if(!f.mortgage) f.mortgage = structuredClone(BLANK.fin.mortgage);
  /* 입력 단위를 천원에서 원으로 바꿨습니다.
     값마다 “원 단위라면 있을 수 없는 크기”인지 보고 1000을 곱합니다.
     이미 원 단위인 값은 기준을 넘으므로 건드리지 않습니다 — 몇 번 실행해도 안전합니다. */
  if((s.v||0) < 3){
    const up = (o,k,min)=>{ const v=Number(o&&o[k])||0; if(v>0 && v<min) o[k]=Math.round(v*1000); };
    // 기준: 8억대 거래에서 “원 단위로는 나올 수 없는 크기”
    ["judicial","stamp","mgmtDeposit"].forEach(k=>up(f,k,10000));            // 부대비용 1만원 미만 없음
    ["incomeSelf","incomeSpouse","income3y","expectedSale"].forEach(k=>up(f,k,1000000));
    (f.loans||[]).forEach(L=>["amount","limit","used"].forEach(k=>up(L,k,1000000)));
    if(s.filing)   Object.keys(s.filing).forEach(k=>up(s.filing,k,1000000));
    if(s.loanNote){ ["principal","balance"].forEach(k=>up(s.loanNote,k,1000000));
                    up(s.loanNote,"monthly",100000); }
    if(s.plan)     Object.values(s.plan).forEach(arr=>(arr||[]).forEach(a=>up(a,"amt",1000000)));
    delete f.unit; delete s.unitWon;
    s.v = 3;
  }
  /* v5 — 차익분석. 예전 저장본에는 supplement·exit 이 없습니다.
     load() 의 Object.assign 은 fin 을 통째로만 병합하므로 여기서 채웁니다.
     예전 모기지 설정의 경과연수 구간(9/14/19/24)·자녀수를 매도 시나리오로 옮깁니다. */
  if((s.v||0) < 4){
    f.supplement = Object.assign(structuredClone(BLANK.fin.supplement), f.supplement||{});
    f.exit       = Object.assign(structuredClone(BLANK.fin.exit),       f.exit||{});
    const mg = f.mortgage || {};
    if(mg.band) f.exit.hold = mg.band;
    if(mg.children) f.exit.children = mg.children;
    if(f.expectedSale > 0) f.exit.saleFrom = f.expectedSale;
    s.v = 4;
  }
  /* v7 — 「나」와 「안」을 가릅니다.
     소득·기존대출·생애최초 여부는 사람에게 딸린 사실이므로 fin 에서 꺼냅니다.
     ── 지금 편집 중이던 값을 「나」로 삼습니다. 저장안 12개가 저마다 다른
        소득을 들고 있을 수 있지만, 맞는 것은 마지막으로 쓰던 값 하나뿐입니다.
     ── 저장안 쪽의 낡은 사본은 지웁니다. 남겨 두면 안을 열 때마다 소득이
        옛 값으로 되돌아갑니다 — 고치자는 문제가 그대로 남습니다.           */
  if((s.v||0) < 5){
    s.me = Object.assign(structuredClone(BLANK.me), s.me||{});
    ME_FROM_FIN.forEach(k=>{
      if(f[k] !== undefined){ s.me[k] = f[k]; delete f[k]; }
    });
    /* 자녀수는 fin.exit 과 fin.mortgage 두 군데에 있었습니다 — 하나로 모읍니다.
       매도 시나리오(exit)에서 실제로 쓰던 값을 참으로 봅니다.               */
    if(!s.me.children){
      s.me.children = Number((f.exit||{}).children)
                   || Number((f.mortgage||{}).children) || 0;
    }
    (s.saved||[]).forEach(v=>{
      const vf = v.state && v.state.fin;
      if(vf) ME_FROM_FIN.forEach(k=> delete vf[k]);
      if(v.state){ delete v.state.role; delete v.state.done; delete v.state.docs; }
    });
    s.v = 5;
  }
  // 조달 재원 입력칸은 시점별 자금 계획으로 대체되었습니다 — 남은 필드를 정리합니다
  ["src","deposit","severance","rentDeposit","otherFin","otherFinLine",
   "savingMonthly","savingMonths"].forEach(k=>{ delete f[k]; });
  delete s.filingSrc;
  return s;
}
/* 저장소가 실제로 되는지 한 번 써 보고 판단합니다.
   시크릿 창, iOS 파일 미리보기, 일부 뷰어 앱에서는 막혀 있어
   창을 닫으면 입력이 사라집니다 — 그때는 화면 위에 띠를 띄웁니다.   */
let STORAGE_OK = (function(){
  try{
    const k = KEY + ":test";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
})();
/* 입력 한 글자마다 전체를 직렬화하면 저사양 폰에서 입력이 끈적해집니다.
   save() 는 미루고, 화면을 떠날 때와 「저장」을 누를 때는 saveNow() 로 즉시 씁니다. */
let saveT = 0;
function saveNow(){
  clearTimeout(saveT); saveT = 0;
  /* 읽지 못한 저장본·더 새 판의 저장본 위에는 쓰지 않습니다.
     지금 화면의 값은 저장되지 않지만, 원본은 살아 있어 되찾을 수 있습니다.
     둘 중 무엇이든 「저장 안 됨」 띠가 떠 있는 상태입니다.                */
  if(LOADFAIL || NEWER) return false;
  /* 편집이 곧 저장입니다 — 지금 값을 편집 중인 안에 늘 함께 굳힙니다.
     계산이 터져도 S 자체는 써야 하므로 따로 감쌉니다 (안은 다음 저장 때 따라잡습니다). */
  try{ ensureCurrent(); commitCur(); }catch(e){ console.error(e); }
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    STORAGE_OK = true;
    return true;
  }catch(e){
    /* 저장소 차단 · 용량 초과 — 조용히 넘기면 저장된 줄 알고 창을 닫습니다 */
    const first = STORAGE_OK;
    STORAGE_OK = false;
    const ns = document.getElementById("nosave"); if(ns) ns.hidden = false;
    if(first) toast("저장하지 못했습니다 — 파일로 내보내 두십시오");
    return false;
  }
}
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 200); }
addEventListener("pagehide", saveNow);

/* ── 체크박스가 눌리지 않던 문제 (v6 부터) ─────────────────────────────
   label.opt 는 겉모양만 체크박스입니다. 값은 label 의 onclick 이 뒤집고 화면을
   다시 그립니다. 그런데 <label> 을 누르면 브라우저가 안쪽 <input> 에 클릭을 한 번
   더 보내고, 그 클릭이 다시 label 로 올라와 onclick 이 두 번 돕니다 — 켜졌다가
   곧바로 꺼져서, 눌러도 아무 일이 없는 것처럼 보였습니다.
   ── 기본 동작만 막으면 두 번째 클릭이 생기지 않습니다. onclick 은 그대로 돕니다.
   ── 모든 체크박스가 이 한 곳을 지나므로 여기서 한 번만 막습니다.            */

const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat("ko-KR");
const won  = n => nf.format(Math.round(n||0)) + "원";
const kwon = n => won((n||0)*1000);                  // 천원 → 원
const man  = n => { n = Math.round((n||0)/10000); return nf.format(n)+"만"; };
/* 입력은 만원 단위로 받습니다 (v7).
   ── 원 단위로 9자리를 치게 하면 폰에서 0 하나 빠뜨리기 쉽고, 틀려도 눈에 안 띕니다.
   ── 저장은 계속 원 단위입니다. 화면에서만 나누고 곱합니다 — 계산·예전 저장본·
      파일은 아무것도 바뀌지 않습니다. 소수 한 자리(=천원)까지 받습니다.        */
const toMan   = n => { const v = Math.round((Number(n)||0)/1000)/10; return v ? String(v) : ""; };
const fromMan = v => Math.round((Number(v)||0)*10000);
const esc  = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* toISOString() 은 UTC 라 오전에는 날짜가 하루 밀립니다 — 파일명·기록은 로컬 시각으로 */
function stamp(withTime){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  const day = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  return withTime ? `${day} ${p(d.getHours())}:${p(d.getMinutes())}` : day;
}
function fmtDate(d){ d = (d instanceof Date)? d : new Date(d);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; }
/* 「2029.02」·「29.02」 — 단지 날짜를 화면용으로 줄입니다 */
const ym      = d => String(d||"").slice(0,7).replace("-",".");
const ymShort = d => String(d||"").slice(2,7).replace("-",".");
const dotDate = d => String(d||"").replaceAll("-",".");
const dateRange = (a,b) => b ? `${dotDate(a)}~${String(b).slice(5).replace("-",".")}` : dotDate(a);
/* 잔금(입주)까지 남은 개월수 — 요약의 「월 얼마씩」 계산에 씁니다 */
function monthsToMoveIn(){ return Math.max(1, Math.round(dday(PROJECT.moveIn)/30.44)); }
function dday(dateStr){
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function ddayLabel(n){ return n===0 ? "D-DAY" : n>0 ? "D-"+n : "D+"+(-n); }

/* ── 일정이 지났는가 ──────────────────────────────────────────────────
   기간이 있는 일정(d~d2)은 **종료일**이 지나야 지난 것입니다.
   시작일로 재면 「8.21~8.24 전시관 관람」이 8.22 에 이미 지난 일이 됩니다.  */
function msN(m){ return dday(m.d2 || m.d); }        /* 남은 날 */
function isPast(m){ return msN(m) < 0; }
function msStarted(m){ return !!m.d2 && dday(m.d) < 0 && msN(m) >= 0; }   /* 진행 중 */
let toastT;

  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 1900);
}

}

/* ══════════════════════════════════════════════════════════════════════════

function getType(){ return PROJECT.types.find(t=>t.id===S.sel.type) || PROJECT.types[0]; }
function optionTable(){ return PROJECT.options[getType().id] || null; }
// 그룹의 표시 번호(①②…) — 타입마다 다르므로 안내 문구에서 찾아 씁니다
function groupNo(g){
  const gr = (optionTable()||[]).find(x=>x.g===g);
  return gr ? gr.n.slice(0,1) : "";
}

// 옵션 선택 가능 여부
/* 선택 가능 여부
   blockedSpace : 어느 문서로도 불가한 조합 — 근거가 있어도 열어 주지 않습니다
   overrideIds  : 공고문 제약을 푸는 근거들(기관 회신·팸플릿 기재)              */
function optAvailable(item){
  if(item.requires){
    const [g,id] = item.requires.split(":");
    if(S.sel.opts[g] !== id) return {ok:false, why:item.req};
  }
  if(item.blockedSpace && S.sel.space === item.blockedSpace)
    return {ok:false, why:item.blockedWhy || item.req};
  /* 여러 변형 중 하나를 요구하는 조건 (「아일랜드장 선택 시」) */
  if(item.requiresAny && !item.requiresAny.some(r=>{ const [g,id]=r.split(":"); return S.sel.opts[g]===id; }))
    return {ok:false, why:item.req};
  /* 「○○ 미선택 시」 가격 — 그 품목이 골라져 있으면 이 변형은 닫힙니다 ("g:*" = 그 그룹 아무거나) */
  if(item.excludes && item.excludes.some(r=>{ const [g,id]=r.split(":");
       return id==="*" ? !!S.sel.opts[g] : S.sel.opts[g]===id; }))
    return {ok:false, why:item.req};
  if(item.requiresSpace && S.sel.space !== item.requiresSpace){
    const ids = item.overrideIds || (item.overrideId ? [item.overrideId] : []);
    const rs = ids.map(id=>PROJECT.responses.find(x=>x.id===id)).filter(Boolean);
    if(rs.length) return {ok:true, overrides:rs};
    return {ok:false, why:item.req};
  }
  return {ok:true};
}

/* ── 신청 유형 ────────────────────────────────────────────────────────────
   사전청약 당첨자와 본청약 당첨자는 납부조건·신청일정·제출서류가 다릅니다.

/* 한 줄(주택가격·발코니·공간선택·추가선택품목)의 납부 배분.
   ── 사전청약은 공고문 표에 적힌 c/m/b 를 그대로 씁니다.
   ── 본청약은 같은 표의 본청약 납부조건 규칙으로 다시 나눕니다:
      계약금·중도금1차·2차 = 각 10%(반올림), 잔금 = 나머지.
      발코니 확장비만 정률이 아니라 회차당 정액입니다 (공고문 6쪽).
   공고문 5·6·7·9쪽의 본청약 표 값과 대조해 전 항목 일치 확인했습니다.     */
/* kind = "base" | "balc" | "opt". roles.*.pay[kind] 에 비율이 있으면 그 규칙으로,
   없으면 사전청약은 공고문 표의 c/m/b 를 그대로, 본청약은 계약금 = 중도금 각 cPct% 로 나눕니다.
   금액은 천원 단위이고 원 단위(소수 셋째 자리)까지 지킵니다.                        */
function payParts(p, pre, flat, kind){
  const R = RL();
  const rule = (R.pay || {})[kind || "base"];
  const r3 = v => Math.round(v * 1000) / 1000;
  if(!rule){
    if(R.id === "pre") return {c:pre.c, mids:[pre.m], b:pre.b};
    const c = flat || Math.round(p * R.cPct / 100);
    return {c, mids:R.mids.map(()=>c), b:p - c*(R.mids.length + 1)};
  }
  const c = flat || r3(p * rule.c / 100);
  const mids = R.mids.map((_,i)=> r3(p * (rule.mids[i] || 0) / 100));
  return {c, mids, b: r3(p - c - mids.reduce((a,b)=>a+b, 0))};
}
function zeroPay(){ return {c:0, mids:RL().mids.map(()=>0), b:0}; }
function addPay(a, x){
  a.c += x.c; a.b += x.b; x.mids.forEach((v,i)=> a.mids[i] += v);
  return a;
}

function calcPrice(){
  const T = getType();
  const F = T.floors[Math.min(S.sel.floor, T.floors.length-1)];
  const minus = S.sel.minus;

  // 마이너스옵션(기본선택품목)을 고르면 공고문의 마이너스옵션 가격표를 씁니다
  const FB = (minus && F.minus) ? F.minus : F;
  const BB = (minus && T.balcony.minus) ? T.balcony.minus : T.balcony;
  let base = {p:FB.price, c:FB.c, m:FB.m, b:FB.b};
  let balc = {price:BB.price, c:BB.c, m:BB.m, b:BB.b};   // 단지 데이터를 건드리지 않게 복사
  let space = {p:0,c:0,m:0,b:0};
  let opts = [];

  if(!minus){
    if(S.sel.space==="sp2" && T.spacePremium)
      space = {p:T.spacePremium.price, c:T.spacePremium.c, m:T.spacePremium.m, b:T.spacePremium.b};
    const tbl = optionTable();
    if(tbl) tbl.forEach(gr=>{
      const pick = S.sel.opts[gr.g];
      if(!pick) return;
      const it = gr.items.find(i=>i.id===pick);
      if(!it) return;
      if(!optAvailable(it).ok) return;
      opts.push({g:gr.n, l:it.l, ...it});
    });
  }

  /* 납부 배분은 유형에 따라 달라지므로 줄마다 다시 계산합니다.
     각 줄에 .pay 를 붙여 두면 「선택 내역」이 그대로 받아 씁니다.        */
  base.pay  = payParts(base.p, base, 0, "base");
  balc.pay  = payParts(balc.price, balc, RL().balcC, "balc");
  space.pay = space.p ? payParts(space.p, space, 0, "opt") : zeroPay();
  opts.forEach(o=> o.pay = payParts(o.p, o, 0, "opt"));

  const optSum = opts.reduce((a,o)=>{ a.p += o.p; addPay(a.pay, o.pay); return a; },
                             {p:0, pay:zeroPay()});
  const pay = [base.pay, balc.pay, space.pay, optSum.pay].reduce(addPay, zeroPay());

  const total    = base.p + balc.price + space.p + optSum.p;
  const contract = pay.c;
  const mids     = pay.mids;                 // 회차별 중도금 (사전청약 1회 · 본청약 2회)
  const mid      = mids.reduce((a,b)=>a+b, 0);
  const balance  = pay.b;

  return {T, F, base, balc, space, opts, optSum, total, contract, mid, mids, balance};
}

function calcExtraCosts(){
  const P = calcPrice();
  const price = P.total*1000;
  const tax = RULES.acquisitionTax(price, P.T.exclusive, S.me.acqFirstTime);
  const bond = Math.floor(price*0.031*(S.fin.bondRate/100));   // 채권 매입 후 즉시매도 할인손실 추정
  const judicial = S.fin.judicial||0;
  const stamp = S.fin.stamp||0;
  const mgmt = S.fin.mgmtDeposit||0;
  /* 중도금 이자는 집단대출을 쓸 때만 발생합니다 (이자후불제 가정).
     회차가 둘이면 1차가 그만큼 오래 굴러가므로 회차별 기간으로 계산합니다 —
     입력한 개월수는 마지막 회차 기준이고, 앞 회차는 그 간격을 더합니다.   */
  const midInt = midLoanOn()
    ? P.mids.reduce((s,amt,i)=>
        s + Math.floor(amt*1000 * (S.fin.midRate/100) * (midMonths(i)/12)), 0) : 0;
  const total = tax.total + bond + judicial + stamp + mgmt + midInt;
  return {tax, bond, judicial, stamp, mgmt, midInt, total, price};
}

/* ── 신혼희망타운 전용 모기지 (F3-2) ───────────────────────────────────────
   담보인정비율(30·40·50·60·70%)을 고르면 금액이 정해집니다.
   선택 비율로 계산한 금액이 가입한도 4억을 넘으면 4억으로 잘리고,
   그때는 실제 LTV 기준으로 수익공유비율이 재적용됩니다. (공고문 3쪽)          */
function calcMortgage(){
  const M = PROJECT.mortgage;
  const cfg = S.fin.mortgage || {};
  const P = calcPrice();
  const price = P.total*1000;                        // 원
  const cap = M.cap*1000;
  if(cfg.enabled === false)
    return {on:false, amount:0, annual:0, price, cap};
  const ltv = cfg.ltv || M.minLtv;
  const raw = Math.floor(price * ltv / 100);
  const amount = Math.min(raw, cap);
  const capped = raw > cap;
  const ltvActual = price ? amount / price * 100 : 0;
  /* 한도로 잘리면 실제 LTV(48.4% 같은 값)가 정산표 눈금에 걸리지 않습니다.
     v4 까지는 아래 눈금으로 절사했으나(40%), 그러면 정산율이 실제보다 낮게
     나옵니다. v5 부터는 실제 LTV 그대로 두고 눈금 사이를 보간합니다.        */
  const shareLtv = capped ? ltvActual : ltv;
  const years = cfg.years || 30;
  const grace = M.graceYears || 0;
  const E = exitCfg();
  const children = E.children;
  const rate  = (cfg.rate != null && cfg.rate !== "") ? Number(cfg.rate) : M.rate;
  const share = RULES.mortgageShare(shareLtv, E.hold, children);
  const sched = RULES.schedule(amount, rate, years, grace, E.hold);
  const annual = sched.annual;
  const sale = S.fin.expectedSale||0;
  const gain = Math.max(0, sale - price);
  return {on:true, ltv, ltvActual, shareLtv, effLtv:shareLtv, capped, amount,
          annual, sched, years, grace, band:E.hold, hold:E.hold, children, rate,
          share, interpolated: RULES.shareIsInterpolated(shareLtv, E.hold),
          gain, shareAmount: Math.floor(gain*share/100), price, cap,
          belowMin: ltv < M.minLtv};
}

/* ── 차익분석 설정 접근자 ─────────────────────────────────────────────────
   예전 저장안·시드에는 exit·supplement 가 없습니다. 상태를 직접 읽는 대신
   언제나 기본값과 병합해 돌려줍니다 — 없는 키 때문에 화면이 깨지지 않게.   */
/* 매도 시나리오 설정.
   ── 자녀수만은 안(案)이 아니라 「나」에서 가져옵니다 (v7). 사실관계이지
      자금조달방안이 아니어서, 안마다 다른 값을 들고 있으면 같은 사람의
      수익공유 정산율이 안에 따라 달라지는 이상한 일이 생깁니다.
      v6 에는 fin.mortgage.children 과 fin.exit.children 둘이 따로 있었습니다. */
function exitCfg(){
  const e = Object.assign(structuredClone(BLANK.fin.exit), (S.fin||{}).exit || {});
  e.children = Math.min(2, Math.max(0, Number((S.me||{}).children) || 0));
  return e;
}
function setChildren(n){
  S.me.children = Math.min(2, Math.max(0, Number(n)||0));
  save(); render();
}
function suppCfg(){
  return Object.assign(structuredClone(BLANK.fin.supplement), (S.fin||{}).supplement || {});
}
/* 수익공유 정산의 기준가격.
   ⚠ 「분양가격」에 유상옵션이 포함되는지는 확인이 필요합니다 (LH·기금).
      지금은 총 계약금액을 씁니다 — 보수적인 쪽(정산액이 크게 나오는 쪽)입니다. */
function shareBasePrice(){ return calcPrice().total*1000; }

/* ── 보완대출 (비수익공유 보조 담보대출) ─────────────────────────────────
   전용 모기지 4억 한도로 모자란 부분을 채우는 가정 상품입니다.
   수익공유 정산 대상이 아니라 매도 시 기금 회수가 없고, 대신 금리가 높습니다.
   ⚠ 현재 존재하지 않는 상품입니다. 신설을 전제로 한 계산입니다.            */
function calcSupplement(opt){
  const cfg = suppCfg();
  const P = calcPrice(), price = P.total*1000;
  const MG = calcMortgage();
  const base = {on:false, amount:0, annual:0, rate:cfg.rate, years:cfg.years,
                grace:cfg.grace, cfg, price, sched:RULES.schedule(0,0,0,0,0)};
  if(!cfg.on || !MG.on) return base;

  let amount = Math.round(Number(cfg.amount)||0);
  if(cfg.mode === "fill70")
    amount = Math.max(0, Math.floor(price*PROJECT.mortgage.maxLtv/100) - MG.amount);
  if(cfg.mode === "dsrMax")
    amount = solveSupplementByDsr();
  if(amount <= 0) return Object.assign(base, {on:true, zero:true});

  const hold = exitCfg().hold;
  const sched = RULES.schedule(amount, cfg.rate, cfg.years, cfg.grace, hold);
  return {on:true, amount, rate:cfg.rate, years:cfg.years, grace:cfg.grace,
          sched, annual:sched.annual, cfg, price,
          ltvAdd: price ? amount/price*100 : 0};
}

/* DSR 기준선 안에 들어가는 보완대출 최대 금액 — 이분탐색.
   ⚠ 반드시 보완대출을 뺀 DSR 로 여유를 계산합니다. calcDsr() 을 그냥 부르면
      calcSupplement → solve → calcDsr → calcSupplement 로 무한 재귀입니다.   */
function solveSupplementByDsr(income){
  const cfg = suppCfg();
  const LIM = Object.assign({dsr:40}, S.fin.limits||{}).dsr;
  const D0  = calcDsr({noSupp:true});
  const inc = income != null ? income
            : (S.me.spouseEmployed ? D0.joint : D0.solo);
  if(!inc) return 0;
  const headroom = inc*LIM/100 - D0.annual;
  if(headroom <= 0) return 0;
  const annualOf = a => RULES.schedule(a, cfg.rate, cfg.years, cfg.grace, cfg.years).annual;
  let lo = 0, hi = 3000000000;
  for(let k=0; k<48; k++){
    const mid = (lo+hi)/2;
    if(annualOf(mid) <= headroom) lo = mid; else hi = mid;
  }
  return Math.floor(lo/10000)*10000;          // 만원 단위 절사
}

/* ══════════════════════════════════════════════════════════════════════════
   차익분석 — 두 대출 구조의 15년 손익
   ──────────────────────────────────────────────────────────────────────────
   같은 집을 같은 총액으로 사되, 그 돈을 어떻게 빌리느냐만 다른 두 안입니다.

     A안  전용 모기지 4억(1.3%) + 보완대출(3.5%)   ← 수익공유는 4억에만 붙습니다
     B안  전용 모기지를 목표 LTV까지 상향(1.3%)    ← 수익공유가 전액에 붙습니다

   A안은 이자를 더 내는 대신 매도할 때 기금에 덜 냅니다. 어느 쪽이 남는지는
   「매도가」와 「보유기간」이 정합니다. 그 경계가 손익분기 매도가입니다.

   ⚠ 보완대출은 현재 존재하지 않는 상품이고, 모기지 가입한도는 4억입니다.
      B안은 한도 상향을, A안은 상품 신설을 각각 전제한 가정 계산입니다.
   ══════════════════════════════════════════════════════════════════════════ */

// 비교할 두 구조를 지금 입력에서 만듭니다
function gainPlans(){
  const M = PROJECT.mortgage;
  const price = shareBasePrice();
  const cfgM = S.fin.mortgage || {};
  const sc = suppCfg(), E = exitCfg();
  const rate  = (cfgM.rate != null && cfgM.rate !== "") ? Number(cfgM.rate) : M.rate;
  const years = cfgM.years || 30;
  const grace = M.graceYears || 0;
  const cap    = M.cap*1000;
  const target = Math.floor(price * E.targetLtv / 100);   // 총 차입 목표
  const aMort  = Math.min(target, cap);
  const A = {key:"A", label:"A안 · 4억 + 보완대출",
             mortgageAmt:aMort, suppAmt:Math.max(0, target - aMort)};
  const B = {key:"B", label:"B안 · 모기지 " + E.targetLtv + "% 상향",
             mortgageAmt:target, suppAmt:0};
  [A,B].forEach(P=>{
    P.mortgageRate = rate; P.mortgageYears = years; P.mortgageGrace = grace;
    P.suppRate = sc.rate;  P.suppYears = sc.years;  P.suppGrace = sc.grace;
    P.loanTotal = P.mortgageAmt + P.suppAmt;
  });
  return {A, B, price, target, cap, capped: target > cap};
}

/* 한 구조의 손익 — 경과연수·자녀수·매도가를 주면 정산액까지 계산합니다.
   경제적 순시세차익 = 시세차익 − 기금 정산 − 누적이자.
   (초기 자기자본과 잔여원금은 대수적으로 상쇄되므로 총 차입액이 달라도 성립합니다) */
function structOutcome(plan, o){
  o = Object.assign({hold:15, children:0, sale:0}, o||{});
  const price = shareBasePrice();
  const mg = RULES.schedule(plan.mortgageAmt, plan.mortgageRate,
                            plan.mortgageYears, plan.mortgageGrace, o.hold);
  const sp = RULES.schedule(plan.suppAmt, plan.suppRate,
                            plan.suppYears, plan.suppGrace, o.hold);
  const ltv   = price ? plan.mortgageAmt/price*100 : 0;
  const share = RULES.mortgageShare(ltv, o.hold, o.children);
  const gain   = Math.max(0, o.sale - price);
  const settle = Math.floor(gain*share/100);
  const cumInterest = mg.cumInterest + sp.cumInterest;
  const hasSupp = plan.suppAmt > 0;
  return {plan, price, ltv, share, gain, settle, cumInterest, mg, sp,
          interpolated: RULES.shareIsInterpolated(ltv, o.hold),
          monthFirst: (plan.mortgageGrace ? mg.gracePay : mg.pay)
                      + (hasSupp ? (plan.suppGrace ? sp.gracePay : sp.pay) : 0),
          monthAfter: mg.pay + sp.pay,
          annual: mg.annual + sp.annual,
          balance: mg.balance + sp.balance,
          net: gain - settle - cumInterest};
}

/* 손익분기 매도가 — 두 안의 순차익이 같아지는 매도가.
   차이는 매도가에 대해 직선이라 반복 계산 없이 한 번에 풉니다.            */
function breakevenSale(A, B, price){
  const dShare = (B.share - A.share)/100;         // A가 아끼는 정산 비율
  const dInt   = A.cumInterest - B.cumInterest;   // A가 더 내는 이자
  if(dInt <= 0)   return {none:true, always:true,
                          why:"A안이 이자도 더 적어 모든 매도가에서 유리합니다"};
  if(dShare <= 0) return {none:true, never:true,
                          why:"이 조건에서는 정산율 차이가 없어 A안이 이자만 더 냅니다"};
  return {sale: Math.round(price + dInt/dShare), dShare, dInt};
}

// 모기지·보완대출을 뺀 나머지 대출(마이너스통장 등)의 연 원리금
function otherLoansAnnual(){
  const list = (S.me.loans||[]).filter(L=>L.name).map(L=>({...L}));
  return RULES.dsr(list, 1).annual;
}
// 한 구조를 실행했을 때의 DSR
function planDsr(out){
  const other = otherLoansAnnual();
  const solo  = S.me.incomeSelf||0;
  const joint = solo + (S.me.spouseEmployed ? (S.me.incomeSpouse||0) : 0);
  const annual = other + out.annual;
  return {annual, solo: solo? annual/solo*100 : 0,
          joint: joint? annual/joint*100 : 0, hasJoint: !!S.me.spouseEmployed};
}

// 보유기간 × 자녀수 격자의 손익분기 매도가
function sensitivityGrid(holds, childs){
  const G = gainPlans();
  return holds.map(h => ({
    hold:h,
    cells: childs.map(c => {
      const a = structOutcome(G.A, {hold:h, children:c});
      const b = structOutcome(G.B, {hold:h, children:c});
      return breakevenSale(a, b, G.price);
    }),
    dInt: structOutcome(G.A,{hold:h}).cumInterest - structOutcome(G.B,{hold:h}).cumInterest
  }));
}

/* 월 상환액이 바뀌는 시점만 뽑습니다 — 거치 종료, 각 대출 만기 */
function paySegments(plan){
  const marks = new Set([0]);
  const add = (v)=>{ if(v>0) marks.add(v); };
  if(plan.mortgageAmt){ add(plan.mortgageGrace); add(plan.mortgageYears); }
  if(plan.suppAmt){     add(plan.suppGrace);     add(plan.suppYears); }
  const pts = [...marks].sort((a,b)=>a-b);
  const mg = RULES.schedule(plan.mortgageAmt, plan.mortgageRate,
                            plan.mortgageYears, plan.mortgageGrace, plan.mortgageYears);
  const sp = RULES.schedule(plan.suppAmt, plan.suppRate,
                            plan.suppYears, plan.suppGrace, plan.suppYears);
  const at = (sch, amt, grace, years, t) => {
    if(!amt || t >= years) return 0;
    return t < grace ? sch.gracePay : sch.pay;
  };
  return pts.slice(0,-1).map((from,i)=>{
    const to = pts[i+1], mid = (from+to)/2;
    const m = at(mg, plan.mortgageAmt, plan.mortgageGrace, plan.mortgageYears, mid);
    const p = at(sp, plan.suppAmt,     plan.suppGrace,     plan.suppYears,     mid);
    return {from, to, mort:m, supp:p, total:m+p};
  }).filter(g=>g.total>0);
}

function calcDsr(opt){
  const o = opt || {};
  const solo  = S.me.incomeSelf||0;
  const joint = solo + (S.me.spouseEmployed ? (S.me.incomeSpouse||0) : 0);
  const list = (S.me.loans||[]).filter(L=>L.name).map(L=>({...L}));
  const MG = calcMortgage();
  // 보완대출을 켜면 DSR 에도 함께 잡힙니다 (역산 중에는 빼고 계산합니다)
  const SP = o.noSupp ? {on:false, amount:0} : calcSupplement();
  if(SP.on && SP.amount)
    list.unshift({name:"보완대출 (차익분석 가정)", type:"supplement", fixedRow:true,
                  assumed:true, amount:SP.amount, rate:SP.rate, years:SP.years,
                  grace:SP.grace});
  // 전용 모기지를 첫 행으로 고정 — 조달 재원의 1순위이자 DSR의 최대 항목
  if(MG.on && MG.amount)
    list.unshift({name:"신혼희망타운 전용 모기지", type:"mortgage", fixedRow:true,
                  amount:MG.amount, rate:MG.rate, years:MG.years, grace:MG.grace});
  const loanOffset = (MG.on && MG.amount ? 1 : 0) + (SP.on && SP.amount ? 1 : 0);
  const r = RULES.dsr(list, solo);
  const dtiSolo  = RULES.dti(r.rows, solo);
  const dtiJoint = RULES.dti(r.rows, joint);
  const P = calcPrice();
  const priceWon = P.total*1000;
  // 주택 담보로 잡히는 대출 — 보완대출도 담보대출이므로 LTV 분자에 들어갑니다
  const mortLoans = MG.amount + (SP.amount||0) + (planBySourceForm().L8c || 0);
  return {rows:r.rows, annual:r.annual, solo, joint, mortgage:MG, supp:SP, loanOffset,
          soloRatio: solo>0 ? r.annual/solo*100 : 0,
          jointRatio: joint>0 ? r.annual/joint*100 : 0,
          dtiAnnual: dtiSolo.annual,
          dtiSolo: dtiSolo.ratio, dtiJoint: dtiJoint.ratio,
          mortLoans, priceWon,
          ltv: priceWon>0 ? mortLoans/priceWon*100 : 0};
}

/* ── 조달 (F3-1 → F4 연동) ────────────────────────────────────────────────
   시점별 자금 계획의 배분이 유일한 조달 입력입니다.
   재원 종류는 자금조달계획서 별지 제1호서식의 기재항목을 그대로 씁니다.        */
// 전용 모기지 실행액 (담보인정비율로 자동 계산)
function autoAmount(key){
  return key === "mortgage" ? calcMortgage().amount : 0;
}

/* ── 시점별 자금 계획 (F3-1) ───────────────────────────────────────────────
   지출 시점을 행으로 두고, 각 시점을 어떤 재원으로 막을지 배분해 적습니다.
   배분은 조달 재원 총액과 별개로 입력하고, 아래 「대조」에서 차이를 봅니다.
   중도금 집단대출을 쓰면 중도금 시점은 대출로 채우고, 잔금 시점에 상환 행이
   자동으로 생깁니다 (조달과 상환이 상쇄되므로 총 부담은 달라지지 않습니다).   */
function midLoanOn(){ return S.fin.midLoanOn !== false; }
/* i 번째 중도금이 잔금까지 굴러가는 개월수 — 마지막 회차가 입력값 그대로입니다 */
function midMonths(i){
  const ms = RL().mids, last = ms[ms.length-1];
  const gap = (new Date(last.date) - new Date(ms[i].date)) / (1000*60*60*24*30.44);
  return (S.fin.midMonths||0) + Math.round(gap);
}

function cashRows(){
  const P = calcPrice(), X = calcExtraCosts(), mid = midLoanOn();
  const rows = [
    {id:"c1", date:ym(PROJECT.contractDate), n:`계약금 ${RL().cPct}%`, amt:P.contract*1000},
    ...RL().mids.map((md,i)=>({
      id: i ? "c2_"+i : "c2",                 // 첫 회차는 예전 저장본과 이어지도록 c2 그대로
      date: md.date.replaceAll("-","."), n: md.label, amt: P.mids[i]*1000, midSrc:mid})),
    {id:"c3", date:ym(PROJECT.moveIn),    n:"잔금", amt:P.balance*1000}
  ];
  const MV = ym(PROJECT.moveIn);
  if(mid) rows.push({id:"c4", date:MV, n:"중도금 집단대출 상환", amt:P.mid*1000, repay:true});
  rows.push(
    {id:"c5", date:MV,   n:"취득세 등",       amt:X.tax.total},
    {id:"c6", date:MV,   n:"등기 부대비용",   amt:X.bond+X.judicial+X.stamp},
    {id:"c7", date:MV,   n:"관리비 예치금",   amt:X.mgmt}
  );
  if(mid) rows.push({id:"c8", date:`${RL().mids[0].date.slice(0,4)}~${PROJECT.moveIn.slice(0,4)}`,
                     n:"중도금 이자 (후불제)", amt:X.midInt});
  return rows;
}

// 배분에 쓸 수 있는 재원 목록
function planSources(){
  const list = [];
  PROJECT.filingLines.forEach(l=>{
    list.push({id:l.id, label:`${l.no} ${l.name}`});
    // ⑧ 주택담보대출 바로 아래에 전용 모기지를 따로 둡니다 (금액이 자동 계산됩니다)
    if(l.id === "L8") list.push({id:"MORT", label:"⑧ 금융기관 대출액 — 신혼희망타운 전용 모기지"});
  });
  if(midLoanOn()) list.push({id:"MID", label:"중도금 집단대출 (잔금 시 상환)"});
  return list;
}
// 배분 재원 → 서식 항목 (전용 모기지는 ⑧ 주택담보대출로 들어갑니다)
function srcToLine(id){ return id === "MORT" ? "L8" : id; }
function srcLabel(id){
  const s = planSources().find(x=>x.id===id);
  return s ? s.label : id;
}
// 닫힌 상태에서 보여줄 짧은 이름
function shortSrc(id){
  if(id === "MID")  return "중도금대출";
  if(id === "MORT") return "⑧ 전용 모기지";
  const l = PROJECT.filingLines.find(x=>x.id===id);
  if(!l) return id;
  const name = l.name.includes(" — ") ? l.name.split(" — ")[1] : l.name;
  return `${l.no} ${name.replace(/\s*\(.*\)$/,"")}`;
}
/* 배분 상태 — 맞으면 “적절”(초록), 모자라면 “부족 N원”(빨강), 넘치면 “초과 N원”(주황) */
function allocState(sum, need){
  const d = (Number(sum)||0) - (Number(need)||0);
  if(d === 0) return {label:"적절",              col:"var(--green)", ok:true};
  if(d < 0)   return {label:`부족 ${won(-d)}`,   col:"var(--red)",   ok:false};
  return           {label:`초과 ${won(d)}`,      col:"var(--amber)", ok:false};
}

// 한 번에 하나만 펼칩니다 — 다른 시점을 누르면 앞의 것은 닫힙니다
function togglePlan(id){
  const wasOpen = !!S.notes["_plan_"+id];
  cashRows().forEach(r=> delete S.notes["_plan_"+r.id]);
  if(!wasOpen) S.notes["_plan_"+id] = true;
  save(); render();
}
// 한 시점의 배분 목록 (중도금 시점의 집단대출은 자동으로 채웁니다)
function planAlloc(row){
  const manual = ((S.plan && S.plan[row.id]) || []).map(a=>
    a.src === "MORT" ? {...a, amt: calcMortgage().amount, locked:true} : a);
  if(row.midSrc) return [{src:"MID", amt:row.amt, auto:true}, ...manual];
  return manual;
}
function planSum(row){ return planAlloc(row).reduce((s,a)=>s+(Number(a.amt)||0), 0); }
/* 시점별 배분의 합계 (천원)
   중도금 집단대출은 잔금 시점에 상환 행으로 다시 나가므로 조달액에 넣지 않습니다. */
function planTotals(){
  const B = planBySource();
  let self = 0, loan = 0, mid = 0;
  Object.entries(B).forEach(([k,v])=>{
    if(k === "MID"){ mid += v; return; }
    const l = PROJECT.filingLines.find(x=>x.id===k);
    if(l && l.kind === "self") self += v; else loan += v;
  });
  return {self, loan, mid, total:self+loan};
}
// 재원별 배분 합계 (원)
function planBySource(){
  const out = {};
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    out[a.src] = (out[a.src]||0) + (Number(a.amt)||0);
  }));
  return out;
}
/* 재원별로 묶은 배분 내역 — 금액, 쓰이는 시점, 계획서 반영 여부 */
function planSourceDetail(){
  const map = {};
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    const v = Number(a.amt)||0;
    if(!map[a.src]) map[a.src] = {src:a.src, amt:0, rows:[], off:0, on:0, auto:!!a.auto};
    const g = map[a.src];
    g.amt += v;
    if(v) g.rows.push(r.n);
    if(a.auto) return;
    if(a.filing === false) g.off++; else g.on++;
  }));
  const self = [], loan = [], other = [];
  Object.values(map).filter(g=>g.amt).forEach(g=>{
    if(g.src === "MID"){ other.push(g); return; }
    const l = PROJECT.filingLines.find(x=>x.id===srcToLine(g.src));
    (l && l.kind === "self" ? self : loan).push(g);
  });
  const ord = g => planSources().findIndex(s=>s.id===g.src);
  self.sort((a,b)=>ord(a)-ord(b)); loan.sort((a,b)=>ord(a)-ord(b));
  const sum = arr => arr.reduce((s,g)=>s+g.amt, 0);
  return {self, loan, other, selfSum:sum(self), loanSum:sum(loan),
          midSum:sum(other), total:sum(self)+sum(loan)};
}

// 서식 항목 기준으로 합친 것 — 전용 모기지는 ⑧ 주택담보대출에 포함됩니다
function planBySourceForm(){
  const out = {};
  Object.entries(planBySource()).forEach(([k,v])=>{
    const line = srcToLine(k);
    out[line] = (out[line]||0) + v;
  });
  return out;
}

/* ── 자금조달계획서 연동 ────────────────────────────────────────────────────
   배분 한 건마다 붙은 「계획서 반영」 체크가 켜진 것만 서식 항목에 더합니다.
   중도금 집단대출은 서식 항목이 아니므로 애초에 빠집니다.                    */
function filingFromPlan(){
  const out = {};
  PROJECT.filingLines.forEach(l=>{ out[l.id] = 0; });
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    if(a.auto || a.filing === false) return;
    const line = srcToLine(a.src);
    if(out[line] === undefined) return;
    out[line] += Number(a.amt)||0;
  }));
  return out;
}
function filingAuto(){ return filingFromPlan(); }
// 계획서에 반영하기로 체크한 배분의 건수·합계
function planFilingStat(){
  let n = 0, sum = 0;
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    if(a.auto || a.filing === false) return;
    if(!PROJECT.filingLines.some(l=>l.id===srcToLine(a.src))) return;
    n++; sum += Number(a.amt)||0;
  }));
  return {n, sum};
}
function toggleAllocFiling(rowId, i){
  const a = S.plan[rowId][i];
  a.filing = (a.filing === false);   // undefined/true → false, false → true
  save(); render();
}
function addAlloc(rowId, src){
  if(!src) return;
  S.plan = S.plan || {}; S.plan[rowId] = S.plan[rowId] || [];
  S.plan[rowId].push({src, amt:0, filing:true});
  S.notes["_plan_"+rowId] = true;
  save(); render();
}
function delAlloc(rowId, i){ S.plan[rowId].splice(i,1); save(); render(); }
function setAllocSrc(rowId, i, src){ S.plan[rowId][i].src = src; save(); render(); }
// 남은 필요액을 그대로 채워 넣습니다
function fillAlloc(rowId, i){
  const row = cashRows().find(r=>r.id===rowId); if(!row) return;
  if(S.plan[rowId][i].src === "MORT") return;   // 금액이 자동 계산되는 항목
  const rest = row.amt - planSum(row) + (Number(S.plan[rowId][i].amt)||0);
  S.plan[rowId][i].amt = Math.max(0, rest); save(); render();
}

function calcCashflow(){
  const P = calcPrice(), X = calcExtraCosts(), PT = planTotals();
  const need = P.total*1000 + X.total;   // 신고금액 + 부대비용
  const have = PT.total;                 // 시점별 배분 합계 (집단대출 제외)
  return {P, X, PT, own:PT.self, loanSum:PT.loan, need, have, gap: have-need};
}

function calcNote(){
  const L = S.loanNote||{};
  const bal = L.balance||0;
  const yearly = bal*((L.rate||0)/100);
  const t = RULES.interestTax(yearly);
  const fair = bal*0.046;                                  // 적정이자율 4.6%
  const shortfall = Math.max(0, fair - yearly);
  const deemedGift = shortfall >= 10000000;                // 연 1천만원 이상이면 증여의제
  return {bal, rate:L.rate||0, yearly, tax:t, fair, shortfall, deemedGift,
          monthly:L.monthly||0};
}

function progress(){
  const ms = MS();
  const done = ms.filter(m=>S.done[m.id]).length;
  return {done, total:ms.length, pct: Math.round(done/ms.length*100)};
}
function nextMilestone(){
  return MS()
    .filter(m=>!S.done[m.id] && dday(m.d2||m.d) >= 0)
    .sort((a,b)=> new Date(a.d) - new Date(b.d))[0]
    || MS().find(m=>!S.done[m.id]);
}

   ── 모달·라이트박스는 기록을 하나 쌓아 두고 뒤로가기로 하나씩 닫습니다.
   ══════════════════════════════════════════════════════════════════════ */
const OV = [];                       /* 열려 있는 겹침(모달·라이트박스)의 닫는 함수 */

function routeStr(){
  if(TAB === "money") return "money/" + SUB.money;
  return TAB;
}

function pushRoute(replace){
  const h = "#" + routeStr();
  if(location.hash === h && !replace) return;
  try{ history[replace ? "replaceState" : "pushState"]({r:routeStr()}, "", h); }catch(e){}
}
function applyRoute(){
  const parts = decodeURIComponent((location.hash||"").replace(/^#/,"")).split("/");
  if(TABS.some(x=>x.id===parts[0])) TAB = parts[0];
  /* v6 까지 쓰던 #home/dash · #home/plan 은 이제 한 화면입니다 — 홈으로 보냅니다.
     카톡에 퍼진 링크가 죽지 않게 합니다. */
  if(parts[0]==="money" && MONEY_SUBS.includes(parts[1])) SUB.money = parts[1];
}

/* 겹침을 열 때 — 닫는 방법을 함께 맡겨 둡니다 */
function pushOverlay(close){
  OV.push(close);
  try{ history.pushState({ov:OV.length}, ""); }catch(e){}
}
/* 버튼(✕)으로 닫을 때 — 쌓아 둔 기록을 되감으면 popstate 가 실제로 닫습니다.
   되감을 게 없으면(기록이 막힌 환경) false 를 돌려주어 직접 닫게 합니다.   */
function popOverlay(){
  if(!OV.length) return false;
  history.back();
  return true;
}

window.addEventListener("popstate", ()=>{
  if(OV.length){ const close = OV.pop(); close(); return; }   /* 겹침부터 닫습니다 */
  applyRoute(); render({top:true});
});

function renderTabs(){

      ${t.label}

}
function renderHeader(){

       예전에는 시작일로 표시해서, 기간이 아직 안 끝난 일정에 D+1 이 떴습니다. */
    const end = nx.d2 || nx.d;
    const n = dday(end);
    const started = nx.d2 && dday(nx.d) < 0;      // 시작은 했고 아직 안 끝난 것
    $("#hdDday").textContent = started

/* 화면을 통째로 다시 그리므로, 다시 그린 뒤 스크롤 위치와 입력 포커스를 되돌려 놓습니다.
   render({top:true}) 을 넘길 때만 맨 위로 올라갑니다 (탭·서브탭 전환).            */
function render(opts){
  const toTop = !!(opts && opts.top);
  const y = window.scrollY || window.pageYOffset || 0;
  const ae = document.activeElement;
  const fk = (ae && ae.dataset) ? ae.dataset.k : null;
  let selStart = null;
  if(fk){ try{ selStart = ae.selectionStart; }catch(e){} }
  const mb = $("#modalBody");
  const mY = mb ? mb.scrollTop : 0;

  renderTabs(); renderHeader();
  /* 「저장되지 않는 상태」는 세 가지입니다 — 저장소가 막혔거나, 저장본을
     읽지 못했거나, 더 새 판이 만든 저장본이거나. 셋 다 덮어쓰면 안 되므로
     같은 띠를 띄우고 사연만 바꿔 적습니다.                                */
  const ns = $("#nosave");
  if(ns){
    ns.hidden = STORAGE_OK && !LOADFAIL && !NEWER;
    const why = LOADFAIL ? "저장해 둔 값을 읽지 못했습니다."
              : NEWER    ? "더 새 판에서 저장한 값입니다."
              : "이 환경은 자동 저장이 안 됩니다.";
    const how = (LOADFAIL || NEWER)
      ? "덮어쓰지 않으려고 저장을 멈춰 두었습니다 — 최신 판으로 열어 보시고, "
      : "창을 닫으면 입력한 값이 사라집니다 — 끝내기 전에 ";
    ns.firstElementChild.textContent = why;
    ns.childNodes[2].textContent = " " + how;
  }
  $("#view").innerHTML =
    ({home:viewHome, me:viewMe, unit:viewUnit, money:viewMoney, docs:viewDocs})[TAB]();
  renderModal(mY);

  /* 이미 받아 둔 그림은 곧바로 보여 줍니다 — 다시 그릴 때 깜빡이지 않게 */
  document.querySelectorAll("#view img").forEach(im=>{
    if(im.complete && im.naturalWidth) im.classList.add("rdy");
  });

  if(toTop){ window.scrollTo(0,0); pushRoute(); }   /* 탭·서브탭 전환 = 주소 갱신 */
  else if(y) window.scrollTo(0,y);

  if(fk){
    const el = document.querySelector('[data-k="'+fk+'"]');
    if(el && el !== document.activeElement){
      el.focus({preventScroll:true});
      if(selStart != null){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
    }
  }
}
